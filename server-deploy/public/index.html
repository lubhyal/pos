    async function searchProducts(search) {
      const resultList = document.getElementById('productResults');
      latestProductResults = [];
      resultList.replaceChildren();
      if (!search) return;

      try {
        const response = await fetch(`/api/cari-barang?q=${encodeURIComponent(search)}`);
        const result = await response.json();
        if (!result.success) throw new Error(result.message);
        latestProductResults = result.data;
        result.data.forEach(item => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
          const description = document.createElement('span');
          const emptyStock = Number(item.Stok) <= 0;
          description.textContent = `${item.Nmbar} · ${item.KdBar} · stok ${formatNumber(item.Stok)} ${item.SatKecil || ''}${emptyStock ? ' (kosong, tetap bisa dijual)' : ''}`;
          if (emptyStock) description.classList.add('text-danger');
          const price = document.createElement('strong');
          price.textContent = formatRupiah(item.HJual);
          button.append(description, price);
          button.addEventListener('click', () => addToSalesCart(item));
          resultList.appendChild(button);
        });
        if (!result.data.length) {
          const empty = document.createElement('div');
          empty.className = 'list-group-item text-muted';
          empty.textContent = 'Barang tidak ditemukan.';
          resultList.appendChild(empty);
        }
      } catch (err) {
        console.error('Gagal mencari barang:', err);
      }
    }

    function addToSalesCart(item) {
      const current = salesCart.get(item.KdBar);
      const nextQuantity = (current?.Qty || 0) + 1;
      salesCart.set(item.KdBar, { ...item, Qty: nextQuantity });
      document.getElementById('searchProduct').value = '';
      document.getElementById('productResults').replaceChildren();
      latestProductResults = [];
      renderSalesCart();
      document.getElementById('searchProduct').focus();
    }

    // Barcode scanner mengirim Enter setelah kode; cari kecocokan persis lalu langsung tambah ke keranjang.
    async function handleProductScan(code) {
      if (!code) return;
      clearTimeout(productSearchTimer);
      let exact = latestProductResults.find(item => item.Barcode === code || item.KdBar === code);
      if (!exact && latestProductResults.length === 1) exact = latestProductResults[0];
      if (!exact) {
        try {
          const response = await fetch(`/api/cari-barang?q=${encodeURIComponent(code)}`);
          const result = await response.json();
          if (result.success) {
            exact = result.data.find(item => item.Barcode === code || item.KdBar === code) || (result.data.length === 1 ? result.data[0] : null);
          }
        } catch (err) {
          console.error('Gagal memindai barang:', err);
        }
      }
      if (exact) addToSalesCart(exact);
      else alert(`Barang dengan kode "${code}" tidak ditemukan.`);
    }

    function setCartQuantity(kdBar, value) {
      const item = salesCart.get(kdBar);
      const quantity = Number(value);
      if (!item) return;
      if (!Number.isFinite(quantity) || quantity <= 0) {
        salesCart.delete(kdBar);
      } else {
        item.Qty = quantity;
      }
      renderSalesCart();
    }

    function renderSalesCart() {
      const body = document.getElementById('cartBody');
      body.replaceChildren();
      if (!salesCart.size) {
        const row = body.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 5;
        cell.className = 'text-center text-muted py-4';
        cell.textContent = 'Keranjang masih kosong.';
      }

      salesCart.forEach(item => {
        const row = body.insertRow();
        const productCell = row.insertCell();
        productCell.textContent = `${item.Nmbar} (${item.SatKecil || 'PCS'})`;
        const priceCell = row.insertCell();
        priceCell.className = 'text-center';
        const price = document.createElement('input');
        price.type = 'number';
        price.min = '0';
        price.step = '1';
        price.inputMode = 'decimal';
        price.value = item.HJual;
        price.className = 'form-control form-control-sm text-end d-block mx-auto';
        price.style.width = '100px';
        price.title = 'Harga bisa diubah manual';
        priceCell.appendChild(price);
        const quantityCell = row.insertCell();
        quantityCell.className = 'text-center';
        const quantity = document.createElement('input');
        quantity.type = 'number';
        quantity.min = '0.001';
        quantity.step = '0.001';
        quantity.inputMode = 'decimal';
        quantity.value = item.Qty;
        quantity.className = 'form-control form-control-sm text-end d-block mx-auto';
        quantity.style.width = '90px';
        const totalCell = row.insertCell();
        totalCell.className = 'text-end fw-semibold';
        totalCell.textContent = formatRupiah(Number(item.HJual) * item.Qty);
        price.addEventListener('input', () => {
          const value = Number(price.value);
          if (!Number.isFinite(value) || value < 0) return;
          item.HJual = value;
          totalCell.textContent = formatRupiah(Number(item.HJual) * item.Qty);
          updateSaleTotals();
        });
        quantity.addEventListener('input', () => {
          const value = Number(quantity.value);
          if (!Number.isFinite(value) || value <= 0) return;
          item.Qty = value;
          totalCell.textContent = formatRupiah(Number(item.HJual) * item.Qty);
          updateSaleTotals();
        });
        quantity.addEventListener('change', () => setCartQuantity(item.KdBar, quantity.value));
        quantityCell.appendChild(quantity);
        const actionCell = row.insertCell();
        actionCell.className = 'text-center';
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'btn btn-sm btn-outline-danger';
        remove.title = 'Hapus barang dari keranjang';
        remove.innerHTML = '<i class="bi bi-x-lg"></i>';
        remove.addEventListener('click', () => { salesCart.delete(item.KdBar); renderSalesCart(); });
        actionCell.appendChild(remove);
      });
      updateSaleTotals();
    }

    function calculateSaleTotals() {
      const subtotal = [...salesCart.values()].reduce((total, item) => total + Number(item.HJual) * item.Qty, 0);
      const discountRate = Math.min(100, Math.max(0, Number(document.getElementById('saleDiscount').value) || 0));
      const taxRate = 0;
      const discountAmount = Math.round(subtotal * discountRate) / 100;
      const taxAmount = Math.round((subtotal - discountAmount) * taxRate) / 100;
      return { subtotal, discountRate, discountAmount, taxRate, taxAmount, grandTotal: Math.round((subtotal - discountAmount + taxAmount) * 100) / 100 };
    }

    function formatRupiah(value) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(Number(value) || 0);
    }

    function setPaymentMethod(method) {
      document.getElementById('paymentMethod').value = method;
      document.querySelectorAll('#paymentMethodGroup [data-method]').forEach(button => {
        const active = button.dataset.method === method;
        button.classList.toggle('active', active);
        button.classList.toggle('btn-primary', active);
        button.classList.toggle('btn-outline-secondary', !active);
      });
      updateSaleTotals();
    }

    function updateSaleTotals() {
      const totals = calculateSaleTotals();
      const paymentMethod = document.getElementById('paymentMethod').value;
      const receivedField = document.getElementById('cashReceived');
      const receivedLabel = document.getElementById('cashReceivedLabel');
      const changeLabel = document.getElementById('saleChangeLabel');
      const isCredit = paymentMethod === 'credit';
      const isCashless = paymentMethod === 'edc' || paymentMethod === 'qris';
      receivedField.disabled = isCashless;
      receivedLabel.textContent = isCredit ? 'Uang muka tunai' : 'Uang diterima';
      changeLabel.textContent = isCredit ? 'Sisa piutang' : 'Kembalian';
      const received = isCashless ? totals.grandTotal : Number(receivedField.value) || 0;
      const difference = isCredit ? Math.max(0, totals.grandTotal - received) : Math.max(0, received - totals.grandTotal);
      const member = document.getElementById('saleCustomer').selectedOptions[0];
      const creditLimit = Number(member?.dataset.creditLimit) || 0;
      const currentOutstanding = Number(member?.dataset.outstanding) || 0;
      const exceedsLimit = isCredit && currentOutstanding + difference > creditLimit + 0.000001;
      if (exceedsLimit) changeLabel.textContent = 'Melebihi plafon';
      document.getElementById('saleSubtotal').textContent = formatRupiah(totals.subtotal);
      document.getElementById('saleGrandTotal').textContent = formatRupiah(totals.grandTotal);
      document.getElementById('saleChange').textContent = formatRupiah(difference);
      document.getElementById('btnCompleteSale').disabled = !salesCart.size || (isCredit && !document.getElementById('saleCustomer').value) || exceedsLimit;
    }

    function clearCart() {
      if (salesCart.size && !confirm('Kosongkan semua barang di keranjang?')) return;
      salesCart.clear();
      currentPendingNo = null;
      document.getElementById('cashReceived').value = '0';
      renderSalesCart();
    }

    async function savePendingSale() {
      if (!salesCart.size) return alert('Keranjang masih kosong.');
      const button = document.querySelector('[onclick="savePendingSale()"]');
      button.disabled = true;
      try {
        const totals = calculateSaleTotals();
        const response = await fetch('/api/penjualan/pending', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            KdKasir: currentUser?.KdUser,
            Disc: totals.discountRate, Ppn: 0,
            items: [...salesCart.values()].map(item => ({ KdBar: item.KdBar, Qty: item.Qty, HJual: item.HJual }))
          })
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.message || 'Gagal menunda transaksi.');
        if (currentPendingNo) await fetch(`/api/penjualan/pending/${encodeURIComponent(currentPendingNo)}`, { method: 'DELETE' });
        currentPendingNo = null;
        salesCart.clear();
        document.getElementById('cashReceived').value = '0';
        renderSalesCart();
        await loadPendingSales();
        alert(result.message);
      } catch (err) {
        alert(err.message);
      } finally {
        button.disabled = false;
      }
    }

    async function loadPendingSales() {
      const list = document.getElementById('pendingSalesList');
      list.replaceChildren();
      const cashier = currentUser?.KdUser;
      if (!cashier) return;
      try {
        const response = await fetch(`/api/penjualan/pending?KdKasir=${encodeURIComponent(cashier)}`);
        const result = await response.json();
        if (!result.success) throw new Error(result.message);
        result.data.forEach(pending => {
          const row = document.createElement('div');
          row.className = 'list-group-item d-flex justify-content-between align-items-center gap-2';
          const resume = document.createElement('button');
          resume.type = 'button'; resume.className = 'btn btn-link text-start p-0 text-decoration-none flex-grow-1';
          resume.textContent = `${pending.nofak} · ${pending.tglfak} · ${formatRupiah(pending.GTotal)}`;
          resume.addEventListener('click', () => resumePendingSale(pending.nofak));
          const remove = document.createElement('button');
          remove.type = 'button'; remove.className = 'btn btn-sm btn-outline-danger'; remove.title = 'Hapus transaksi tertunda';
          remove.innerHTML = '<i class="bi bi-trash"></i>';
          remove.addEventListener('click', () => deletePendingSale(pending.nofak));
          row.append(resume, remove);
          list.appendChild(row);
        });
        if (!result.data.length) {
          const empty = document.createElement('div');
          empty.className = 'small text-muted'; empty.textContent = 'Tidak ada transaksi tertunda.';
          list.appendChild(empty);
        }
      } catch (err) {
        console.error('Gagal memuat transaksi tertunda:', err);
      }
    }

    async function resumePendingSale(invoice) {
      if (salesCart.size && !confirm('Ganti keranjang saat ini dengan transaksi tertunda?')) return;
      try {
        const response = await fetch(`/api/penjualan/pending/${encodeURIComponent(invoice)}`);
        const result = await response.json();
        if (!result.success) throw new Error(result.message || 'Gagal memuat transaksi.');
        salesCart.clear();
        result.data.items.forEach(item => {
          if (item.Nmbar) salesCart.set(item.KdBar, { ...item, Qty: Number(item.Qty) });
        });
        document.getElementById('saleDiscount').value = result.data.Disc || 0;
        currentPendingNo = invoice;
        renderSalesCart();
      } catch (err) {
        alert(err.message);
      }
    }

    async function deletePendingSale(invoice) {
      if (!confirm(`Hapus transaksi tertunda ${invoice}?`)) return;
      try {
        const response = await fetch(`/api/penjualan/pending/${encodeURIComponent(invoice)}`, { method: 'DELETE' });
        const result = await response.json();
        if (!result.success) throw new Error(result.message);
        if (currentPendingNo === invoice) currentPendingNo = null;
        await loadPendingSales();
      } catch (err) {
        alert(err.message);
      }
    }

    async function completeSale() {
      if (!salesCart.size) return;
      const totals = calculateSaleTotals();
      const paymentMethod = document.getElementById('paymentMethod').value;
      const payload = {
        KdKasir: currentUser?.KdUser,
        KdCust: document.getElementById('saleCustomer').value || null,
        items: [...salesCart.values()].map(item => ({ KdBar: item.KdBar, Qty: item.Qty, HJual: item.HJual })),
        pendingNo: currentPendingNo,
        Disc: totals.discountRate,
        Ppn: 0,
        paymentMethod,
        cashReceived: Number(document.getElementById('cashReceived').value) || 0
      };

      const button = document.getElementById('btnCompleteSale');
      button.disabled = true;
      try {
        const response = await fetch('/api/penjualan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.message || 'Gagal menyimpan penjualan.');
        if (businessSettings.CetJual === '1') printSaleReceipt(result, [...salesCart.values()], paymentMethod, payload.cashReceived);
        const completedPendingNo = currentPendingNo;
        const wasCreditSale = paymentMethod === 'credit';
        salesCart.clear();
        currentPendingNo = null;
        document.getElementById('cashReceived').value = '0';
        renderSalesCart();
        if (completedPendingNo) {
          try {
            const pendingResponse = await fetch(`/api/penjualan/pending/${encodeURIComponent(completedPendingNo)}`, { method: 'DELETE' });
            if (!pendingResponse.ok) throw new Error('Transaksi tertunda gagal dihapus.');
            await loadPendingSales();
          } catch (err) {
            alert('Penjualan berhasil, tetapi transaksi tertunda gagal dihapus. Hapus dari daftar tertunda agar tidak diproses ulang.');
          }
        }
        const settlement = paymentMethod === 'credit'
          ? `Sisa piutang: ${formatRupiah(result.creditBalance)}`
          : `Kembalian: ${formatRupiah(result.change)}`;
        alert(`${result.message}\nTotal: ${formatRupiah(result.grandTotal)}\n${settlement}`);
        if (wasCreditSale) await loadMembers();
      } catch (err) {
        alert(err.message);
      } finally {
        button.disabled = !salesCart.size;
      }
    }

    async function reprintSale(sale) {
      try {
        const params = new URLSearchParams({ nofak: sale.nofak, tglfak: sale.tglfak, kdkasir: sale.kdkasir });
        const result = await (await fetch(`/api/nota/penjualan?${params}`)).json();
        if (!result.success) throw new Error(result.message);
        printNota(result.data, 'sale');
      } catch (err) { alert(err.message); }
    }

    async function reprintReturn(noFak) {
      try {
        const result = await (await fetch(`/api/nota/retur?nofak=${encodeURIComponent(noFak)}`)).json();
        if (!result.success) throw new Error(result.message);
        printNota(result.data, 'return');
      } catch (err) { alert(err.message); }
    }

    function printNota(d, kind) {
      const receipt = document.getElementById('receiptPrint');
      receipt.replaceChildren();
      const addLine = (text, className = '') => {
        const line = document.createElement('p');
        line.textContent = text || '';
        if (className) line.className = className;
        receipt.appendChild(line);
      };
      const isReturn = kind === 'return';
      addLine(businessSettings.NmUsaha || 'ABID KARYA SAYUR', 'fw-bold');
      addLine(businessSettings.ALUsaha || '');
      addLine([businessSettings.Kota, businessSettings.NoTelp].filter(Boolean).join(' · '));
      addLine(isReturn ? '*** NOTA RETUR ***' : (d.KOND === '1' ? '*** CETAK ULANG ***' : '*** CETAK ULANG (BATAL) ***'), 'fw-bold');
      if (isReturn) {
        addLine(`No. Retur: ${d.NoFak}`);
        addLine(`Faktur asal: ${d.SourceNoFak} (${d.SourceTgl})`);
        addLine(`Tanggal: ${d.TglFak}`);
      } else {
        addLine(`Faktur: ${d.nofak}`);
        addLine(`Tanggal: ${d.tglfak} ${String(d.jam || '').slice(0, 5)}`);
      }
      addLine(`Kasir: ${d.NmKasir || ''}`);
      const table = document.createElement('table');
      const body = table.createTBody();
      d.items.forEach(item => {
        const row = body.insertRow();
        const product = row.insertCell(); product.colSpan = 2; product.textContent = item.NmBar;
        const detail = body.insertRow();
        detail.insertCell().textContent = `${formatNumber(item.Qty)} x ${formatRupiah(item.HJual)}`;
        const amount = detail.insertCell(); amount.className = 'text-end';
        amount.textContent = formatRupiah(item.Jumlah);
      });
      receipt.appendChild(table);
      if (isReturn) {
        addLine(`TOTAL RETUR: ${formatRupiah(d.GTotal)}`, 'receipt-total fw-bold');
        addLine(`Refund tunai: ${formatRupiah(d.Bayar)}`);
        addLine('Terima kasih');
      } else {
        addLine(`Subtotal: ${formatRupiah(d.total)}`);
        addLine(`Diskon: ${formatRupiah(d.DiscRp)}`);
        addLine(`TOTAL: ${formatRupiah(d.GTotal)}`, 'receipt-total fw-bold');
        [businessSettings.FootJual, businessSettings.FootJual2, businessSettings.FootJual3].filter(Boolean).forEach(line => addLine(line));
      }
      window.print();
    }

    function printSaleReceipt(result, items, paymentMethod, cashReceived) {
      const receipt = document.getElementById('receiptPrint');
      receipt.replaceChildren();
      const addLine = (text, className = '') => {
        const line = document.createElement('p');
        line.textContent = text || '';
        if (className) line.className = className;
        receipt.appendChild(line);
      };

      addLine(businessSettings.NmUsaha || 'ABID KARYA SAYUR', 'fw-bold');
      addLine(businessSettings.ALUsaha || '');
      addLine([businessSettings.Kota, businessSettings.NoTelp].filter(Boolean).join(' · '));
      if (businessSettings.Headjual) addLine(businessSettings.Headjual);
      addLine(`Faktur: ${result.invoice}`);
      addLine(`Tanggal: ${new Date().toLocaleString('id-ID')}`);
      addLine(`Kasir: ${currentUser?.Nmuser || currentUser?.KdUser || ''}`);

      const table = document.createElement('table');
      const body = table.createTBody();
      items.forEach(item => {
        const row = body.insertRow();
        const product = row.insertCell(); product.colSpan = 2; product.textContent = item.Nmbar;
        const detail = body.insertRow();
        detail.insertCell().textContent = `${formatNumber(item.Qty)} x ${formatRupiah(item.HJual)}`;
        const amount = detail.insertCell(); amount.className = 'text-end';
        amount.textContent = formatRupiah(Number(item.HJual) * item.Qty);
      });
      receipt.appendChild(table);
      addLine(`Subtotal: ${formatRupiah(result.subtotal)}`);
      addLine(`Diskon: ${formatRupiah(result.discountAmount)}`);
      addLine(`TOTAL: ${formatRupiah(result.grandTotal)}`, 'receipt-total fw-bold');
      if (paymentMethod === 'cash') {
        addLine(`Tunai: ${formatRupiah(cashReceived)}`);
        addLine(`Kembali: ${formatRupiah(result.change)}`);
      } else if (paymentMethod === 'credit') {
        addLine(`Uang muka: ${formatRupiah(cashReceived)}`);
        addLine(`Sisa piutang: ${formatRupiah(result.creditBalance)}`);
      } else addLine('Pembayaran: Kartu');
      [businessSettings.FootJual, businessSettings.FootJual2, businessSettings.FootJual3].filter(Boolean).forEach(line => addLine(line));
      window.print();
    }

    function downloadExcelTemplate() {
      const workbook = XLSX.utils.book_new();
      const worksheet = XLSX.utils.aoa_to_sheet([excelFields]);
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Barang');
      XLSX.writeFile(workbook, 'template_barang.xlsx');
    }

    async function fetchAllBarang() {
      const firstResponse = await fetch('/api/barang?page=1&limit=500');
      const firstResult = await firstResponse.json();
      if (!firstResult.success) throw new Error(firstResult.message || 'Gagal mengambil data barang.');

      const allItems = [...firstResult.data];
      for (let page = 2; page <= firstResult.pagination.totalPages; page++) {
        const response = await fetch(`/api/barang?page=${page}&limit=500`);
        const result = await response.json();
        if (!result.success) throw new Error(result.message || `Gagal mengambil halaman ${page}.`);
        allItems.push(...result.data);
      }
      return allItems;
    }

    async function downloadExcel() {
      try {
        const allItems = await fetchAllBarang();
        const workbook = XLSX.utils.book_new();
        const rows = allItems.map(item => excelFields.map(field => item[field] ?? ''));
        const worksheet = XLSX.utils.aoa_to_sheet([excelFields, ...rows]);
        XLSX.utils.book_append_sheet(workbook, worksheet, 'Barang');
        XLSX.writeFile(workbook, 'data_barang.xlsx');
      } catch (err) {
        alert('Gagal mengunduh Excel: ' + err.message);
      }
    }

    function parseExcelNumber(value) {
      if (value === '' || value === null || value === undefined) return 0;
      const number = typeof value === 'number' ? value : Number(String(value).trim().replace(',', '.'));
      return Number.isFinite(number) ? number : null;
    }

    async function importExcel(event) {
      const file = event.target.files[0];
      event.target.value = '';
      if (!file) return;

      try {
        const workbook = XLSX.read(await file.arrayBuffer(), { type: 'array' });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        if (!worksheet) throw new Error('File Excel tidak memiliki lembar kerja.');

        const rows = XLSX.utils.sheet_to_json(worksheet, { defval: '', raw: true });
        if (!rows.length) throw new Error('Tidak ada baris data pada file Excel.');
        if (!confirm(`Pulihkan ${rows.length} baris? KdBar yang sudah ada akan diperbarui, sedangkan KdBar baru akan ditambahkan.`)) return;

        const existingItems = await fetchAllBarang();
        const existingByKdBar = new Map(existingItems.map(item => [String(item.KdBar), item]));

        let added = 0;
        let updated = 0;
        const errors = [];
        const fileCodes = new Set();
        for (let index = 0; index < rows.length; index++) {
          const row = rows[index];
          const rowNumber = index + 2;
          const payload = Object.fromEntries(excelFields.map(field => [field, row[field] ?? '']));
          payload.KdBar = payload.KdBar === '' ? '' : String(payload.KdBar).trim();
          ['Barcode', 'KdKel', 'Nmbar', 'SatKecil', 'RAK', 'KDSUPP', 'WARNA', 'UKURAN'].forEach(field => {
            payload[field] = String(payload[field]).trim();
          });

          if (!payload.Nmbar) {
            errors.push(`Baris ${rowNumber}: Nama Barang (Nmbar) wajib diisi.`);
            continue;
          }

          if (payload.KdBar && fileCodes.has(payload.KdBar)) {
            errors.push(`Baris ${rowNumber}: KdBar ${payload.KdBar} muncul lebih dari sekali di file.`);
            continue;
          }
          if (payload.KdBar) fileCodes.add(payload.KdBar);

          let invalidNumber = false;
          ['HBeli', 'HJual', 'StAwal'].forEach(field => {
            payload[field] = parseExcelNumber(payload[field]);
            if (payload[field] === null) invalidNumber = true;
          });
          if (invalidNumber) {
            errors.push(`Baris ${rowNumber}: HBeli, HJual, dan StAwal harus berupa angka.`);
            continue;
          }

          try {
            const existingItem = payload.KdBar ? existingByKdBar.get(payload.KdBar) : null;
            const response = await fetch(existingItem ? `/api/barang/${encodeURIComponent(payload.KdBar)}` : '/api/barang', {
              method: existingItem ? 'PUT' : 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (result.success) {
              if (existingItem) updated++;
              else {
                added++;
                if (result.KdBar) existingByKdBar.set(String(result.KdBar), payload);
              }
            } else errors.push(`Baris ${rowNumber}: ${result.message || 'Gagal menyimpan barang.'}`);
          } catch (err) {
            errors.push(`Baris ${rowNumber}: gagal terhubung ke server.`);
          }
        }

        const imported = added + updated;
        const summary = [`Pemulihan selesai. Ditambahkan: ${added}; diperbarui: ${updated}; gagal: ${errors.length}.`];
        if (errors.length) summary.push('', ...errors.slice(0, 10), ...(errors.length > 10 ? [`...dan ${errors.length - 10} kegagalan lainnya.`] : []));
        alert(summary.join('\n'));
        if (imported > 0) location.reload();
      } catch (err) {
        alert('Gagal membaca Excel: ' + err.message);
      }
    }

    function formatNumber(num) {
      return new Intl.NumberFormat('id-ID', { minimumFractionDigits: 0 }).format(num || 0);
    }

    function updateModalMarkup() {
      const hBeli = parseFloat(document.getElementById('inputHBeli').value) || 0;
      const hJual = parseFloat(document.getElementById('inputHJual').value) || 0;
      if (hBeli > 0) {
        const markup = (((hJual - hBeli) / hBeli) * 100).toFixed(2);
        document.getElementById('inputMarkup').textContent = markup + '%';
      } else {
        document.getElementById('inputMarkup').textContent = '0%';
      }
    }

    async function loadOptions() {
      try {
        const res = await fetch('/api/options');
        const result = await res.json();
        if (result.success) {
          const kelSelect = document.getElementById('filterKdKel');
          const rakSelect = document.getElementById('filterRak');
          const inputKelSelect = document.getElementById('inputKdKel');
          kelompokOptions = result.kelompok;
          kelSelect.replaceChildren(kelSelect.options[0]);
          inputKelSelect.replaceChildren(inputKelSelect.options[0]);
          rakSelect.replaceChildren(rakSelect.options[0]);

          result.kelompok.forEach(k => {
            const label = result.kelompokNama?.[k] ? `${k} · ${result.kelompokNama[k]}` : k;
            kelSelect.add(new Option(label, k));
            inputKelSelect.add(new Option(label, k));
          });
          result.rak.forEach(r => {
            rakSelect.add(new Option(r, r));
          });

          inputKelSelect.value = kelompokOptions.includes('UM') ? 'UM' : (kelompokOptions[0] || '');
          if (!editingKdBar) updateNextKdBar();
        }
      } catch (err) {
        console.error('Error options:', err);
      }
    }

    async function updateNextKdBar() {
      const kdKel = document.getElementById('inputKdKel').value;
      const codeInput = document.getElementById('inputKdBar');
      const requestId = ++kdBarPreviewRequest;

      if (!kdKel) {
        codeInput.textContent = 'Pilih kelompok';
        return;
      }

      codeInput.textContent = 'Menghitung...';
      try {
        const res = await fetch(`/api/kode-barang-berikutnya?kdKel=${encodeURIComponent(kdKel)}`);
        const result = await res.json();
        if (requestId !== kdBarPreviewRequest) return;
        codeInput.textContent = result.success ? result.KdBar : 'Kode tidak tersedia';
      } catch (err) {
        if (requestId === kdBarPreviewRequest) codeInput.textContent = 'Kode tidak tersedia';
        console.error('Error kode barang:', err);
      }
    }

    async function loadDataBarang(page = currentPage) {
      currentPage = page;
      const params = new URLSearchParams({ page: currentPage, limit: 20, sortBy: stockSort.by, sortDir: stockSort.dir });
      document.querySelectorAll('#stockView [data-filter]').forEach(field => {
        const value = field.value.trim();
        if (value !== '') params.set(field.dataset.filter, value);
      });

      try {
        const res = await fetch(`/api/barang?${params.toString()}`);
        const result = await res.json();

        if (result.success) {
          renderTable(result.data);
          renderPagination(result.pagination);
        }
      } catch (err) {
        console.error('Error load barang:', err);
        document.getElementById('tableBody').innerHTML = `
          <tr><td colspan="12" class="text-center py-4 text-danger fw-bold">Gagal terhubung ke database server.</td></tr>
        `;
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      itemsCache = {};

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="12" class="text-center py-4 text-muted">Tidak ada data barang ditemukan.</td></tr>`;
        return;
      }

      data.forEach(item => {
        itemsCache[item.KdBar] = item;
        const markupVal = parseFloat(item.markup || 0).toFixed(2);

        const stockValue = Number(item.Stok ?? item.StAwal);
        tbody.innerHTML += `
          <tr>
            <td data-label="Kode"><span class="badge bg-light text-dark border">${item.KdBar}</span></td>
            <td data-label="Barcode">${item.Barcode || '-'}</td>
            <td data-label="Nama Barang" class="fw-semibold">${item.Nmbar}</td>
            <td data-label="Kelompok">${item.KdKel || '-'}</td>
            <td data-label="Satuan">${item.SatKecil || 'PCS'}</td>
            <td data-label="H. Beli" class="text-end">${formatNumber(item.HBeli)}</td>
            <td data-label="H. Jual" class="text-end fw-semibold text-primary">${formatNumber(item.HJual)}</td>
            <td data-label="Markup" class="text-end">${markupVal}%</td>
            <td data-label="Stok" class="text-end fw-bold ${stockValue < 0 ? 'text-negative' : ''}">${formatNumber(item.Stok ?? item.StAwal)}</td>
            <td data-label="Rak" ${item.RAK && item.RAK !== '0' ? '' : 'data-empty'}>${item.RAK || '-'}</td>
            <td data-label="Supplier" ${item.KDSUPP && item.KDSUPP !== '0' ? '' : 'data-empty'}>${item.KDSUPP || '-'}</td>
            <td data-label="Aksi" class="text-center cell-actions">
              <div class="d-flex justify-content-center gap-1">
                <button class="btn btn-sm btn-outline-warning" onclick="openEditModal('${item.KdBar}')" title="Edit barang">
                  <i class="bi bi-pencil-square"></i><span class="d-md-none ms-1">Edit</span>
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteBarang('${item.KdBar}')" title="Hapus barang">
                  <i class="bi bi-trash"></i><span class="d-md-none ms-1">Hapus</span>
                </button>
              </div>
            </td>
          </tr>
        `;
      });
      if (!['admin', 'bos'].includes(currentUser.Role)) {
        tbody.querySelectorAll('button[onclick^="deleteBarang"]').forEach(button => button.remove());
      }
    }

    function renderPagination(pg) {
      document.getElementById('totalItemsBadge').innerText = `Total: ${pg.totalItems}`;
      document.getElementById('paginationInfo').innerText = `Halaman ${pg.currentPage} dari ${pg.totalPages} (${pg.totalItems} item)`;

      const container = document.getElementById('paginationControls');
      container.innerHTML = '';
      if (pg.totalPages <= 1) return;

      const item = (label, page, { disabled = false, active = false, extra = '' } = {}) => `
        <li class="page-item ${disabled ? 'disabled' : ''} ${active ? 'active' : ''} ${extra}">
          <a class="page-link" href="#" onclick="loadDataBarang(${page}); return false;">${label}</a>
        </li>`;
      let html = item('<i class="bi bi-chevron-left"></i>', pg.currentPage - 1, { disabled: pg.currentPage === 1 });
      let last = 0;
      for (let i = 1; i <= pg.totalPages; i++) {
        if (i === 1 || i === pg.totalPages || (i >= pg.currentPage - 1 && i <= pg.currentPage + 1)) {
          if (i - last > 1) html += '<li class="page-item disabled d-none d-md-block"><span class="page-link">&hellip;</span></li>';
          html += item(i, i, { active: i === pg.currentPage, extra: 'd-none d-md-block' });
          last = i;
        }
      }
      html += `<li class="page-item disabled d-md-none"><span class="page-link">${pg.currentPage} / ${pg.totalPages}</span></li>`;
      html += item('<i class="bi bi-chevron-right"></i>', pg.currentPage + 1, { disabled: pg.currentPage === pg.totalPages });
      container.innerHTML = html;
    }

    function openAddModal() {
      document.getElementById('formBarang').reset();
      document.getElementById('modalBarangTitle').innerText = 'Tambah Barang Baru';
      editingKdBar = null;
      document.getElementById('inputKdKel').value = kelompokOptions.includes('UM') ? 'UM' : (kelompokOptions[0] || '');
      document.getElementById('inputSatKecil').value = 'PCS';
      document.getElementById('inputRak').value = '0';
      document.getElementById('inputWarna').value = '0';
      document.getElementById('inputUkuran').value = '0';
      document.getElementById('inputMarkup').textContent = '0%';
      updateNextKdBar();
      modalInstance.show();
    }

    function openEditModal(kdBar) {
      const item = itemsCache[kdBar];
      if (!item) return;

      editingKdBar = kdBar;
      document.getElementById('modalBarangTitle').innerText = 'Edit Barang: ' + item.KdBar;
      document.getElementById('inputKdBar').textContent = item.KdBar;

      document.getElementById('inputBarcode').value = item.Barcode || '';
      document.getElementById('inputKdKel').value = item.KdKel || 'UM';
      document.getElementById('inputNmbar').value = item.Nmbar || '';
      document.getElementById('inputSatKecil').value = item.SatKecil || 'PCS';
      document.getElementById('inputHBeli').value = item.HBeli || 0;
      document.getElementById('inputHJual').value = item.HJual || 0;
      document.getElementById('inputStAwal').value = item.StAwal || 0;
      document.getElementById('inputRak').value = item.RAK || '0';
      document.getElementById('inputKdSupp').value = item.KDSUPP || '';
      document.getElementById('inputWarna').value = item.WARNA || '0';
      document.getElementById('inputUkuran').value = item.UKURAN || '0';

      updateModalMarkup();
      modalInstance.show();
    }

    async function deleteBarang(kdBar) {
      const item = itemsCache[kdBar];
      if (!item || !confirm(`Hapus barang "${item.Nmbar}" (${kdBar})? Tindakan ini tidak bisa dibatalkan.`)) return;

      try {
        const res = await fetch(`/api/barang/${encodeURIComponent(kdBar)}`, { method: 'DELETE' });
        const result = await res.json();

        if (result.success) {
          alert(result.message);
          loadDataBarang();
        } else {
          alert('Gagal: ' + result.message);
        }
      } catch (err) {
        console.error('Error delete:', err);
        alert('Terjadi kesalahan koneksi ke server.');
      }
    }

    document.getElementById('formBarang').addEventListener('submit', async function(e) {
      e.preventDefault();

      const isEdit = Boolean(editingKdBar);
      const kdBar = editingKdBar || '';
      const selectedKdKel = document.getElementById('inputKdKel').value.trim() || 'UM';
      if (isEdit && itemsCache[kdBar]?.KdKel !== selectedKdKel &&
          !confirm(`Kelompok berubah. Kode barang akan diganti menjadi ${document.getElementById('inputKdBar').textContent} dan referensi transaksi/riwayat stok ikut diperbarui. Lanjutkan?`)) {
        return;
      }

      const payload = {
        KdBar: isEdit ? kdBar : '',
        Barcode: document.getElementById('inputBarcode').value.trim(),
        KdKel: selectedKdKel,
        Nmbar: document.getElementById('inputNmbar').value.trim(),
        SatKecil: document.getElementById('inputSatKecil').value.trim() || 'PCS',
        HBeli: parseFloat(document.getElementById('inputHBeli').value) || 0,
        HJual: parseFloat(document.getElementById('inputHJual').value) || 0,
        StAwal: parseFloat(document.getElementById('inputStAwal').value) || 0,
        RAK: document.getElementById('inputRak').value.trim(),
        KDSUPP: document.getElementById('inputKdSupp').value.trim(),
        WARNA: document.getElementById('inputWarna').value.trim(),
        UKURAN: document.getElementById('inputUkuran').value.trim()
      };

      const url = isEdit ? `/api/barang/${kdBar}` : '/api/barang';
      const method = isEdit ? 'PUT' : 'POST';

      try {
        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (result.success) {
          alert(result.newKdBar && result.newKdBar !== kdBar ? `${result.message}\nKode barang baru: ${result.newKdBar}` : result.message);
          modalInstance.hide();
          loadDataBarang();
        } else if (result.duplicate) {
          const duplicate = result.duplicate;
          const shouldEdit = confirm(`${result.message}\n\nBuka barang tersebut untuk diperbarui?`);
          if (shouldEdit) {
            itemsCache[duplicate.KdBar] = duplicate;
            openEditModal(duplicate.KdBar);
          }
        } else {
          alert('Gagal: ' + result.message);
        }
      } catch (err) {
        console.error('Error save:', err);
        alert('Terjadi kesalahan koneksi ke server.');
      }
    });
  </script>
