<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Manajemen Stok Barang</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');</script>
  <!-- Bootstrap 5.3 (versi stabil terbaru; Bootstrap 6 belum dirilis) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --sidebar-w: 260px; --accent: #4f7cff; --glass-bg: rgba(255,255,255,.58); --glass-border: rgba(255,255,255,.75); --glass-shadow: 0 8px 32px rgba(31,38,135,.12); }
    [data-bs-theme="dark"] { --glass-bg: rgba(28,34,56,.55); --glass-border: rgba(255,255,255,.1); --glass-shadow: 0 8px 32px rgba(0,0,0,.35); }
    body { font-family: 'Segoe UI', 'Source Sans 3', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 40%, #dbeafe 70%, #d1fae5 100%) fixed; min-height: 100vh; }
    [data-bs-theme="dark"] body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 45%, #0c2a3d 100%) fixed; }
    body::before, body::after { content: ''; position: fixed; z-index: -1; border-radius: 50%; filter: blur(90px); opacity: .45; pointer-events: none; }
    body::before { width: 420px; height: 420px; background: #8b5cf6; top: -120px; right: 10%; }
    body::after { width: 380px; height: 380px; background: #06b6d4; bottom: -120px; left: 25%; }
    .card, .modal-content, .list-group-item, .app-footer, .topbar { background: var(--glass-bg) !important; -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid var(--glass-border); }
    .card { box-shadow: var(--glass-shadow); border-radius: 1rem; }
    .card-header, .card-footer { background: transparent !important; border-color: var(--glass-border); }
    .card-header { font-weight: 600; }
    .table { --bs-table-bg: transparent; --bs-table-striped-bg: rgba(79,124,255,.06); --bs-table-hover-bg: rgba(79,124,255,.12); }
    .table-responsive { max-height: 62vh; overflow-y: auto; }
    .table > thead th { white-space: nowrap; position: sticky; top: 0; z-index: 2; background: var(--bs-body-bg) !important; background-image: linear-gradient(rgba(79,124,255,.14), rgba(79,124,255,.14)); }
    .table .filter-row th { top: 2.4rem; padding: .35rem .4rem; font-weight: 400; background-image: none; }
    .filter-row .form-control, .filter-row .form-select { min-width: 5.2rem; }
    .filter-row .range-pair { display: flex; gap: .25rem; min-width: 10rem; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--accent); }
    th.sortable .sort-ind { opacity: .35; font-size: .75rem; margin-left: .2rem; }
    th.sortable.sorted .sort-ind { opacity: 1; color: var(--accent); }
    .form-control, .form-select { background-color: rgba(255,255,255,.6); border-color: rgba(120,130,160,.3); border-radius: .6rem; }
    [data-bs-theme="dark"] .form-control, [data-bs-theme="dark"] .form-select { background-color: rgba(15,23,42,.5); }
    .form-control:focus, .form-select:focus { box-shadow: 0 0 0 .2rem rgba(79,124,255,.25); border-color: var(--accent); }
    .btn { border-radius: .6rem; }
    .btn-primary { background: linear-gradient(135deg, #4f7cff, #7c4dff); border: 0; box-shadow: 0 4px 14px rgba(79,124,255,.4); }
    .btn-primary:hover, .btn-primary:focus { background: linear-gradient(135deg, #3f6bf0, #6c3df0); }
    .btn-success { background: linear-gradient(135deg, #11998e, #38ef7d); border: 0; color: #053b2f; }
    .btn-success:hover { background: linear-gradient(135deg, #0e8a80, #2fdc70); color: #053b2f; }
    .btn-glass { background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(10px); }
    .text-negative { color: var(--bs-danger) !important; }
    .modal-content { border-radius: 1rem; }
    .topbar { position: sticky; top: 0; z-index: 1030; height: 56px; padding-block: 0; border-width: 0 0 1px; }
    .app-layout { display: flex; align-items: flex-start; min-height: 100vh; }
    .sidebar { --bs-offcanvas-width: var(--sidebar-w); --bs-offcanvas-color: #cbd5f5; --bs-offcanvas-border-color: transparent; flex: 0 0 auto; }
    .sidebar, .sidebar .offcanvas-body { background: linear-gradient(180deg, #1e1b4b 0%, #312e81 55%, #1e3a8a 100%) !important; color: #cbd5f5; }
    .sidebar .brand { display: flex; align-items: center; gap: .6rem; height: 56px; padding: 0 1rem; color: #fff; font-weight: 700; font-size: 1.05rem; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.12); flex: 0 0 auto; }
    .sidebar .brand i { color: #a5b4fc; font-size: 1.4rem; }
    .sidebar .sidebar-heading { display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: #8b95d6; padding: .95rem .75rem .3rem; }
    .sidebar .sidebar-heading:first-child { padding-top: .1rem; }
    .sidebar .nav-link { display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left; color: #cbd5f5; padding: .55rem .75rem; border-radius: .7rem; font-size: .9rem; border: 0; background: transparent; margin-bottom: 2px; transition: background .15s, transform .15s; }
    .sidebar .nav-link:hover { background: rgba(255,255,255,.1); color: #fff; transform: translateX(2px); }
    .sidebar .nav-link.active { background: linear-gradient(135deg, rgba(79,124,255,.95), rgba(124,77,255,.95)); color: #fff; font-weight: 600; box-shadow: 0 4px 14px rgba(79,124,255,.45); }
    .sidebar .nav-link i { width: 1.1rem; text-align: center; font-size: 1rem; }
    .main-wrapper { flex: 1 1 0%; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .content-header { padding: 1rem 1.5rem .25rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .25rem; }
    .content-header h1 { font-size: 1.5rem; font-weight: 700; margin: 0; background: linear-gradient(90deg, #4f7cff, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .content-header .breadcrumb { margin: 0; font-size: .85rem; }
    .main-content { flex: 1 1 0%; min-width: 0; padding-top: .75rem; padding-bottom: 1.5rem; }
    .app-footer { padding: .75rem 1.5rem; font-size: .8rem; border-width: 1px 0 0; color: var(--bs-secondary-color); }
    #authScreen { background: transparent; }
    .stat-card { position: relative; overflow: hidden; color: #fff; border-radius: 1rem; padding: 1.1rem 1.25rem; box-shadow: 0 10px 24px rgba(0,0,0,.18); height: 100%; transition: transform .2s; }
    .stat-card:hover { transform: translateY(-3px); }
    .stat-card .stat-icon { position: absolute; right: .9rem; top: .6rem; font-size: 3.2rem; opacity: .25; }
    .stat-card .stat-label { font-size: .85rem; opacity: .9; }
    .stat-card .stat-value { font-size: 1.6rem; font-weight: 700; line-height: 1.3; }
    .stat-card .stat-sub { font-size: .78rem; opacity: .9; }
    .g-blue { background: linear-gradient(135deg, #4f7cff, #7c4dff); }
    .g-green { background: linear-gradient(135deg, #11998e, #38ef7d); }
    .g-orange { background: linear-gradient(135deg, #ff9966, #ff5e62); }
    .g-purple { background: linear-gradient(135deg, #8e2de2, #e052c0); }
    .g-teal { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
    .g-red { background: linear-gradient(135deg, #f43f5e, #be123c); }
    .mini-stat { display: flex; align-items: center; gap: .9rem; padding: .9rem 1rem; border-radius: 1rem; background: var(--glass-bg); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); backdrop-filter: blur(16px); height: 100%; }
    .mini-icon { width: 46px; height: 46px; border-radius: .9rem; display: grid; place-items: center; color: #fff; font-size: 1.3rem; flex: 0 0 auto; }
    .mini-value { font-size: 1.25rem; font-weight: 700; line-height: 1.2; }
    .mini-label { font-size: .78rem; color: var(--bs-secondary-color); }
    .chart-box { position: relative; height: 280px; }
    .dash-table { max-height: 300px; }
    @media (min-width: 992px) {
      .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    }
    #stockView .filter-panel .form-label { font-size: .75rem; margin-bottom: .15rem; color: var(--bs-secondary-color); }
    #stockView .range-pair { display: flex; gap: .35rem; }
    #stockView .pagination { gap: .25rem; }
    #stockView .pagination .page-link { border-radius: .6rem !important; min-width: 2.2rem; text-align: center; background: var(--glass-bg); border: 1px solid var(--glass-border); }
    #stockView .pagination .page-item.active .page-link { background: linear-gradient(135deg, #4f7cff, #7c4dff); color: #fff; border-color: transparent; }
    @media (max-width: 767.98px) {
      #stockView .table-responsive { max-height: none; overflow: visible; }
      #stockView table, #stockView tbody { display: block; width: 100%; min-width: 0 !important; }
      #stockView thead { display: none; }
      #stockView tbody tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .3rem .5rem; margin: .45rem .5rem 0; padding: .5rem .65rem; border: 1px solid var(--glass-border); border-radius: .7rem; background: var(--glass-bg); box-shadow: 0 1px 6px rgba(31,38,135,.08); }
      #stockView tbody tr:last-child { margin-bottom: .5rem; }
      #stockView td { display: flex; flex-direction: column; gap: 0; padding: 0 !important; border: 0; background: transparent !important; text-align: left !important; font-size: .8rem; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
      #stockView td::before { content: attr(data-label); color: var(--bs-secondary-color); font-size: .62rem; text-transform: uppercase; letter-spacing: .03em; }
      #stockView td[data-label="Nama Barang"] { grid-column: 1 / -1; order: -2; font-size: .9rem; }
      #stockView td[data-label="Nama Barang"]::before { display: none; }
      #stockView td[data-empty] { display: none; }
      #stockView td.cell-actions { grid-column: 1 / -1; margin-top: .15rem; }
      #stockView td.cell-actions::before { display: none; }
      #stockView td.cell-actions > div { justify-content: stretch !important; }
      #stockView td.cell-actions .btn { flex: 1 1 0; padding: .1rem .4rem; font-size: .75rem; }
      #stockView .card-header { padding: .4rem .6rem !important; }
      #stockView .card-header .btn { flex: 1 1 auto; font-size: .75rem; padding: .15rem .4rem; }
      #stockView .card-footer { flex-direction: column; gap: .35rem; text-align: center; padding: .4rem !important; }
      #stockView .pagination { justify-content: center; flex-wrap: nowrap; }
    }    @media (max-width: 575.98px) {
      html, body { max-width: 100%; overflow-x: hidden; }
      body { font-size: .875rem; }
      .navbar { padding-block: .3rem; margin-bottom: 0 !important; }
      .navbar > .container-fluid { padding-inline: .65rem !important; gap: .25rem; flex-wrap: nowrap; }
      .navbar-brand { margin: 0; font-size: .95rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .navbar .container-fluid > .d-flex { flex-wrap: nowrap !important; justify-content: flex-end; gap: .35rem !important; overflow-x: auto; padding-bottom: .2rem; scrollbar-width: thin; }
      .navbar .container-fluid > .d-flex > * { flex: 0 0 auto; }
      .navbar .btn { padding: .3rem .5rem; font-size: .72rem; white-space: nowrap; }
      #currentUserLabel { max-width: 5.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .main-content { padding-top: .65rem; }
      .container-fluid.px-4 { padding-inline: .625rem !important; }
      .row.g-3 { --bs-gutter-x: .65rem; --bs-gutter-y: .65rem; }
      .card { border-radius: .35rem; }
      .card-body { padding: .75rem; }
      .card-header, .card-footer { padding: .5rem .65rem !important; }
      .table { font-size: .78rem; }
      .table-responsive { max-height: 48vh; overscroll-behavior: contain; }
      #kasirView .table-responsive, #purchaseView .table-responsive, #opnameView .table-responsive { max-height: 40vh; }
      #kasirView table, #purchaseView table, #opnameView table { min-width: 560px; }
      #purchaseReturnView .table-responsive, #salesReturnView .table-responsive { max-height: 40vh; }
      #purchaseReturnView table, #salesReturnView table { min-width: 600px; }
      /* Tema gelap: pastikan semua teks terbaca */
      [data-bs-theme="dark"] { --bs-body-color: #e2e8f0; --bs-secondary-color: rgba(203,213,225,.8); --bs-heading-color: #f1f5f9; --bs-emphasis-color: #fff; color-scheme: dark; }
      [data-bs-theme="dark"] body, [data-bs-theme="dark"] .card, [data-bs-theme="dark"] .modal-content, [data-bs-theme="dark"] .dropdown-menu, [data-bs-theme="dark"] .list-group-item, [data-bs-theme="dark"] .offcanvas { color: #e2e8f0; }
      [data-bs-theme="dark"] .card-header, [data-bs-theme="dark"] .form-label, [data-bs-theme="dark"] label, [data-bs-theme="dark"] h1, [data-bs-theme="dark"] h2, [data-bs-theme="dark"] h3, [data-bs-theme="dark"] h4, [data-bs-theme="dark"] h5, [data-bs-theme="dark"] h6 { color: #f1f5f9; }
      [data-bs-theme="dark"] .text-muted, [data-bs-theme="dark"] .text-body-secondary, [data-bs-theme="dark"] small { color: rgba(203,213,225,.85) !important; }
      [data-bs-theme="dark"] .text-dark, [data-bs-theme="dark"] .link-dark { color: #e2e8f0 !important; }
      [data-bs-theme="dark"] .table { --bs-table-color: #e2e8f0; --bs-table-bg: transparent; --bs-table-striped-color: #e2e8f0; --bs-table-hover-color: #fff; --bs-table-striped-bg: rgba(255,255,255,.04); --bs-table-hover-bg: rgba(255,255,255,.08); --bs-table-border-color: rgba(255,255,255,.1); }
      [data-bs-theme="dark"] .table > thead th, [data-bs-theme="dark"] .table-light, [data-bs-theme="dark"] .table-light > th, [data-bs-theme="dark"] .table-light > td { --bs-table-bg: #1e293b; --bs-table-color: #f1f5f9; background-color: #1e293b !important; color: #f1f5f9 !important; }
      [data-bs-theme="dark"] .bg-light, [data-bs-theme="dark"] .bg-white { background-color: rgba(30,41,59,.7) !important; color: #e2e8f0 !important; }
      [data-bs-theme="dark"] .form-control, [data-bs-theme="dark"] .form-select, [data-bs-theme="dark"] .input-group-text { color: #f1f5f9; border-color: rgba(255,255,255,.18); }
      [data-bs-theme="dark"] .form-control::placeholder { color: rgba(203,213,225,.6); }
      [data-bs-theme="dark"] .form-select option { background: #1e293b; color: #f1f5f9; }
      [data-bs-theme="dark"] .btn-outline-secondary { --bs-btn-color: #cbd5e1; --bs-btn-border-color: rgba(255,255,255,.25); --bs-btn-hover-color: #fff; --bs-btn-hover-bg: rgba(255,255,255,.12); }
      [data-bs-theme="dark"] .page-link { color: #e2e8f0; background: rgba(30,41,59,.7); border-color: rgba(255,255,255,.12); }
      [data-bs-theme="dark"] .page-item.active .page-link { color: #fff; }
      [data-bs-theme="dark"] .text-negative { color: #fb7185 !important; }
      .report-tabs { gap: .35rem; padding-bottom: .25rem; }
      .report-tabs .nav-link { white-space: nowrap; border-radius: 999px; padding: .35rem .9rem; font-size: .88rem; color: var(--bs-body-color); background: var(--glass-bg); border: 1px solid var(--glass-border); }
      .report-tabs .nav-link.active { background: linear-gradient(135deg,#4f7cff,#7c4dff); color: #fff; border-color: transparent; }
      .report-scroll { max-height: 60vh; overflow: auto; }
      .report-table th { position: sticky; top: 0; z-index: 1; white-space: nowrap; }
      .report-search { max-width: 220px; }
      .rc-icon { width: 2.6rem; height: 2.6rem; border-radius: 12px; display: grid; place-items: center; font-size: 1.25rem; flex: none; }
      .rc-value { font-size: 1.1rem; overflow-wrap: anywhere; }
      .min-w-0 { min-width: 0; }      .pagination { flex-wrap: wrap; justify-content: flex-end; }
      .pagination .page-link { padding: .25rem .45rem; }
      .modal-dialog { width: auto; height: calc(100dvh - .8rem); margin: .4rem; display: flex; align-items: center; }
      .modal-content { max-height: 100%; width: 100%; }
      .modal-body { overflow-y: auto; }
      #authScreen { min-height: 100dvh; padding: 1rem !important; }
      #authScreen .card-body { padding: 1rem !important; }
      #pendingSalesList .list-group-item { min-width: 0; }
    }
    #receiptPrint { display: none; }
    @media print {
      @page { size: 80mm auto; margin: 3mm; }
      body * { visibility: hidden !important; }
      #receiptPrint, #receiptPrint * { visibility: visible !important; }
      #receiptPrint { display: block !important; position: absolute; inset: 0 auto auto 0; width: 74mm; color: #000 !important; background: #fff !important; font: 10pt/1.25 monospace; }
      #receiptPrint h1, #receiptPrint h2, #receiptPrint p { margin: 0 0 2mm; text-align: center; }
      #receiptPrint h1 { font-size: 12pt; }
      #receiptPrint table { width: 100%; border-collapse: collapse; font-size: 9pt; }
      #receiptPrint th, #receiptPrint td { padding: 1mm 0; border-bottom: 1px dashed #555; }
      #receiptPrint .text-end { text-align: right; }
      #receiptPrint .receipt-total { margin-top: 2mm; border-top: 1px solid #000; padding-top: 2mm; }
    }
  </style>
</head>
<body>

  <section id="authScreen" class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="card shadow-sm w-100" style="max-width: 440px;">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold mb-1">ABID KARYA SAYUR</h1>
        <p class="text-muted small mb-4">Login POS</p>
        <div id="authError" class="alert alert-danger py-2 d-none" role="alert"></div>
        <form id="loginForm">
          <div class="mb-3"><label for="loginCode" class="form-label">Pilih user</label><select id="loginCode" class="form-select" autocomplete="username" required><option value="">Memuat user...</option></select></div>
          <div class="mb-3"><label for="loginPassword" class="form-label">Password</label><input id="loginPassword" type="password" class="form-control" autocomplete="current-password" required></div>
          <button id="loginButton" class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i> Masuk</button>
        </form>
        <form id="setupForm" class="d-none">
          <h2 class="h6 fw-bold">Setup admin pertama</h2>
          <div class="mb-2"><label for="setupToken" class="form-label small">Token dari konsol server</label><input id="setupToken" class="form-control form-control-sm" autocomplete="off" required></div>
          <div class="mb-2"><label for="setupCode" class="form-label small">Kode user (maks. 5 karakter)</label><input id="setupCode" class="form-control form-control-sm" maxlength="5" list="legacyUserCodes" required><datalist id="legacyUserCodes"></datalist></div>
          <div class="mb-2"><label for="setupName" class="form-label small">Nama user</label><input id="setupName" class="form-control form-control-sm" maxlength="20" required></div>
          <div class="mb-3"><label for="setupPassword" class="form-label small">Password baru (minimal 3 karakter)</label><input id="setupPassword" type="password" class="form-control form-control-sm" minlength="3" autocomplete="new-password" required></div>
          <button id="setupButton" class="btn btn-primary w-100" type="submit"><i class="bi bi-shield-lock me-1"></i> Buat Admin</button>
        </form>
      </div>
    </div>
  </section>

  <div id="appShell" class="d-none">

  <div class="app-layout">
    <aside class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" id="sidebarNav" aria-labelledby="sidebarNavLabel">
      <div class="d-flex align-items-center">
        <a class="brand flex-grow-1" href="#" id="sidebarNavLabel"><i class="bi bi-basket3-fill"></i><span>ABID KARYA SAYUR</span></a>
        <button type="button" class="btn-close btn-close-white d-lg-none me-3" data-bs-dismiss="offcanvas" data-bs-target="#sidebarNav" aria-label="Close"></button>
      </div>      <div class="offcanvas-body d-flex flex-column p-2 p-lg-3">
        <div class="nav flex-column">
          <span class="sidebar-heading">Utama</span>
          <button class="nav-link active" id="btnShowDashboard" onclick="showView('dashboardView'); loadDashboard()"><i class="bi bi-speedometer2"></i> Dashboard</button>

          <span class="sidebar-heading">Gudang & Stok</span>
          <button class="nav-link" id="btnShowStock" onclick="showView('stockView')"><i class="bi bi-boxes"></i> Stok Barang</button>
          <button class="nav-link" id="btnShowPurchase" onclick="showView('purchaseView')"><i class="bi bi-truck"></i> Pembelian</button>
          <button class="nav-link" id="btnShowOpname" onclick="showView('opnameView')"><i class="bi bi-clipboard-check"></i> Stok Opname</button>
          <button class="nav-link" id="btnShowPurchaseReturn" onclick="showView('purchaseReturnView'); loadReturnablePurchases()"><i class="bi bi-arrow-return-left"></i> Retur Beli</button>

          <span class="sidebar-heading">Transaksi</span>
          <button class="nav-link" id="btnShowKasir" onclick="showView('kasirView')"><i class="bi bi-cart3"></i> Kasir</button>
          <button class="nav-link" id="btnShowPiutang" onclick="showView('piutangView'); loadReceivables()"><i class="bi bi-cash-coin"></i> Piutang</button>
          <button class="nav-link" id="btnShowSalesReturn" onclick="showView('salesReturnView'); loadReturnableSales()"><i class="bi bi-receipt-cutoff"></i> Retur Jual</button>

          <span class="sidebar-heading">Laporan</span>
          <button class="nav-link" id="btnShowCashierReport" onclick="showView('cashierReportView'); loadCashierReport()"><i class="bi bi-bar-chart"></i> Laporan Penjualan</button>
          <button class="nav-link" id="btnShowReport" onclick="showView('fullReportView'); loadFullReport()"><i class="bi bi-graph-up"></i> Laporan Lengkap</button>

          <span class="sidebar-heading d-none" id="adminSidebarHeading">Administrasi</span>
          <button class="nav-link d-none" id="btnManageUsers" onclick="openUserManagement()"><i class="bi bi-people"></i> Manajemen User</button>
          <button class="nav-link d-none" id="btnMasterData" onclick="showView('masterView'); loadMasterData()"><i class="bi bi-people"></i> Data Master</button>
          <button class="nav-link d-none" id="btnSettings" onclick="showView('settingsView'); loadSettings()"><i class="bi bi-gear"></i> Pengaturan</button>
        </div>
      </div>

  <!-- Script Logic Application -->
  <script>
    let currentPage = 1;
    let modalInstance = null;
    let supplierModalInstance = null;
    let usersModalInstance = null;
    let currentUser = null;
    let editingManagedUserCode = null;
    let businessSettings = {};
    let itemsCache = {};
    let kelompokOptions = [];
    let editingKdBar = null;
    let kdBarPreviewRequest = 0;
    let lastCashierReport = null;
    const excelFields = ['KdBar', 'Barcode', 'KdKel', 'Nmbar', 'SatKecil', 'HBeli', 'HJual', 'StAwal', 'RAK', 'KDSUPP', 'WARNA', 'UKURAN'];
    const salesCart = new Map();
    const purchaseCart = new Map();
    const opnameCart = new Map();
    let currentPendingNo = null;
    let latestProductResults = [];
    let productSearchTimer = null;
    let purchaseSearchTimer = null;
    let opnameSearchTimer = null;
    let editingGroupCode = null;
    let editingMemberCode = null;
    let editingMasterSupplierCode = null;
    let currentReturnPurchase = null;
    let purchaseReturnLines = new Map();
    let currentReturnSale = null;
    let salesReturnLines = new Map();
    const nativeFetch = window.fetch.bind(window);

    window.fetch = async (resource, options) => {
      const response = await nativeFetch(resource, options);
      const requestUrl = typeof resource === 'string' ? resource : resource.url;
      if (response.status === 401 && !requestUrl.includes('/api/auth/')) {
        currentUser = null;
        salesCart.clear();
        purchaseCart.clear();
        opnameCart.clear();
        currentPendingNo = null;
        setAuthMode(false);
        showAuthenticationError('Sesi login berakhir. Silakan masuk kembali.');
        loadLoginUsers().catch(err => showAuthenticationError(err.message));
      }
      return response;
    };

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await loadMenuViews();
      } catch (err) {
        showAuthenticationError(`Gagal memuat halaman menu: ${err.message}`);
        return;
      }

      modalInstance = new bootstrap.Modal(document.getElementById('modalBarang'));
      const modalBarangEl = document.getElementById('modalBarang');
      ['inputHBeli', 'inputHJual', 'inputStAwal'].forEach(id => {
        document.getElementById(id).addEventListener('focus', e => e.target.select());
      });
      modalBarangEl.addEventListener('shown.bs.modal', () => {
        const kel = document.getElementById('inputKdKel');
        (kel.value ? document.getElementById('inputNmbar') : kel).focus();
      });
      supplierModalInstance = new bootstrap.Modal(document.getElementById('modalSupplier'));
      usersModalInstance = new bootstrap.Modal(document.getElementById('modalUsers'));

      // Fitur pencarian otomatis
      let filterTimer;
      document.querySelectorAll('#stockView [data-filter]').forEach(field => {
        field.addEventListener('input', () => {
          clearTimeout(filterTimer);
          filterTimer = setTimeout(() => { currentPage = 1; loadDataBarang(); }, 300);
        });
      });

      document.getElementById('inputKdKel').addEventListener('change', () => {
        updateNextKdBar();
      });

      // Recalculate markup otomatis
      document.getElementById('inputHBeli').addEventListener('input', updateModalMarkup);
      document.getElementById('inputHJual').addEventListener('input', updateModalMarkup);
      document.getElementById('excelFile').addEventListener('change', importExcel);
      document.getElementById('formSupplier').addEventListener('submit', saveSupplier);
      document.getElementById('loginForm').addEventListener('submit', loginUser);
      document.getElementById('setupForm').addEventListener('submit', setupFirstAdmin);
      document.getElementById('userManagementForm').addEventListener('submit', saveManagedUser);
      document.getElementById('groupForm').addEventListener('submit', saveGroup);
      document.getElementById('memberForm').addEventListener('submit', saveMember);
      document.getElementById('masterSupplierForm').addEventListener('submit', saveMasterSupplier);
      document.getElementById('settingsForm').addEventListener('submit', saveSettings);
      document.getElementById('btnLogout').addEventListener('click', logoutUser);
      document.getElementById('returnSourceInvoice').addEventListener('change', event => loadPurchaseReturn(event.target.value));
      document.getElementById('returnSourceSale').addEventListener('change', event => loadSalesReturn(event.target.value));
      document.getElementById('saleCustomer').addEventListener('change', () => {
        const selected = document.getElementById('saleCustomer').selectedOptions[0];
        if (Number(selected?.dataset.discount) > 0 && Number(document.getElementById('saleDiscount').value) === 0) {
          document.getElementById('saleDiscount').value = selected.dataset.discount;
        }
        updateSaleTotals();
      });
      document.getElementById('setupCode').addEventListener('input', () => {
        const code = document.getElementById('setupCode').value;
        const selected = [...document.querySelectorAll('#legacyUserCodes option')].find(option => option.value === code);
        if (selected) document.getElementById('setupName').value = selected.dataset.name || '';
      });
      document.getElementById('searchProduct').addEventListener('input', event => {
        clearTimeout(productSearchTimer);
        const search = event.target.value.trim();
        productSearchTimer = setTimeout(() => searchProducts(search), 180);
      });
      document.getElementById('searchProduct').addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          handleProductScan(event.target.value.trim());
        }
      });
      document.getElementById('purchaseSearch').addEventListener('input', event => {
        clearTimeout(purchaseSearchTimer);
        const search = event.target.value.trim();
        purchaseSearchTimer = setTimeout(() => searchPurchaseProducts(search), 180);
      });
      document.getElementById('opnameSearch').addEventListener('input', event => {
        clearTimeout(opnameSearchTimer);
        const search = event.target.value.trim();
        opnameSearchTimer = setTimeout(() => searchOpnameProducts(search), 180);
      });
      ['purchaseTax', 'purchaseExtra', 'purchasePaid'].forEach(id => {
        document.getElementById(id).addEventListener('input', updatePurchaseTotal);
      });
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('purchaseDate').value = today;
      document.getElementById('reportFrom').value = today;
      document.getElementById('reportTo').value = today;
      document.getElementById('cashierReportFrom').value = today;
      document.getElementById('cashierReportTo').value = today;
      document.getElementById('opnameDate').value = today;
      document.getElementById('returnPurchaseDate').value = today;
      document.getElementById('returnSaleDate').value = today;
      ['saleDiscount', 'cashReceived', 'paymentMethod', 'saleCustomer'].forEach(id => {
        document.getElementById(id).addEventListener('input', updateSaleTotals);
        document.getElementById(id).addEventListener('change', updateSaleTotals);
      });
      document.addEventListener('keydown', event => {
        const methods = { '1': 'cash', '2': 'qris', '3': 'edc', '4': 'credit' };
        const view = document.getElementById('kasirView');
        if (event.altKey && methods[event.key] && view && !view.classList.contains('d-none')) {
          event.preventDefault();
          setPaymentMethod(methods[event.key]);
        }
      });
      updateThemeIcon();
      updateSortIndicators();
      if (window.innerWidth >= 992) document.getElementById('stockFilters').classList.add('show');
      setPaymentMethod('cash');
      await initializeAuthentication();
    });

    async function loadMenuViews() {
      const menuPages = [
        'master-data.html',
        'dashboard.html',
        'users.html',
        'settings.html',
        'purchase-return.html',
        'sales-return.html',
        'piutang.html',
        'purchase.html',
        'stock-opname.html',
        'sales-report.html',
        'report.html',
        'kasir.html',
        'stock.html'
      ];
      const pages = await Promise.all(menuPages.map(async page => {
        const response = await fetch(`/pages/${page}`);
        if (!response.ok) throw new Error(`${page} (HTTP ${response.status})`);
        return response.text();
      }));
      document.getElementById('menuViews').innerHTML = pages.join('\n');
    }

    function showAuthenticationError(message) {
      const error = document.getElementById('authError');
      error.textContent = message;
      error.classList.remove('d-none');
    }

    function setAuthMode(setupMode) {
      document.getElementById('loginForm').classList.toggle('d-none', setupMode);
      document.getElementById('setupForm').classList.toggle('d-none', !setupMode);
      document.getElementById('authError').classList.add('d-none');
      document.getElementById('authScreen').classList.remove('d-none');
      document.getElementById('appShell').classList.add('d-none');
    }

    async function initializeAuthentication() {
      try {
        const response = await fetch('/api/auth/me');
        if (response.ok) {
          const result = await response.json();
          enterAuthenticatedApp(result.user);
          return;
        }

        const statusResponse = await fetch('/api/auth/setup-status');
        const status = await statusResponse.json();
        if (!statusResponse.ok) throw new Error(status.message || 'Gagal memeriksa status login.');
        if (status.setupRequired) {
          const list = document.getElementById('legacyUserCodes');
          list.replaceChildren();
          status.users.forEach(user => {
            const option = document.createElement('option');
            option.value = user.KdUser;
            option.dataset.name = user.Nmuser;
            list.appendChild(option);
          });
          document.getElementById('setupCode').value = status.users[0]?.KdUser || 'BOS';
          document.getElementById('setupName').value = status.users[0]?.Nmuser || 'ADMINISTRATOR';
          setAuthMode(true);
        } else {
          await loadLoginUsers();
          setAuthMode(false);
        }
      } catch (err) {
        setAuthMode(false);
        showAuthenticationError(err.message || 'Server login tidak dapat dihubungi.');
      }
    }

    async function loadLoginUsers() {
      const select = document.getElementById('loginCode');
      try {
        const response = await fetch('/api/auth/users');
        const result = await response.json();
        if (!result.success) throw new Error(result.message || 'Gagal memuat user.');
        select.replaceChildren();
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = result.data.length ? 'Pilih user' : 'Belum ada user aktif';
        select.appendChild(placeholder);
        result.data.forEach(user => {
          const option = document.createElement('option');
          option.value = user.KdUser;
          option.textContent = `${user.Nmuser} (${user.KdUser})`;
          select.appendChild(option);
        });
        select.disabled = result.data.length === 0;
      } catch (err) {
        select.replaceChildren(new Option('Gagal memuat user', ''));
        select.disabled = true;
        throw err;
      }
    }

    function enterAuthenticatedApp(user) {
      currentUser = user;
      document.getElementById('authScreen').classList.add('d-none');
      document.getElementById('appShell').classList.remove('d-none');
      document.getElementById('currentUserLabel').textContent = `${user.Nmuser} (${user.KdUser})`;
      const manager = ['admin', 'bos'].includes(user.Role);
      const cashier = ['admin', 'bos', 'kasir'].includes(user.Role);
      const warehouse = ['admin', 'bos', 'gudang'].includes(user.Role);
      document.getElementById('btnManageUsers').classList.toggle('d-none', !manager);
      document.getElementById('btnMasterData').classList.toggle('d-none', !manager);
      document.getElementById('btnSettings').classList.toggle('d-none', !manager);
      document.getElementById('adminSidebarHeading').classList.toggle('d-none', !manager);
      document.getElementById('btnShowKasir').classList.toggle('d-none', !cashier);
      document.getElementById('btnShowPiutang').classList.toggle('d-none', !cashier);
      document.getElementById('btnShowReport').classList.toggle('d-none', !manager);
      document.getElementById('btnShowCashierReport').classList.toggle('d-none', !cashier);
      document.getElementById('btnShowPurchase').classList.toggle('d-none', !warehouse);
      document.getElementById('btnShowOpname').classList.toggle('d-none', !warehouse);
      document.getElementById('btnShowPurchaseReturn').classList.toggle('d-none', !warehouse);
      document.getElementById('btnShowSalesReturn').classList.toggle('d-none', !cashier);
      document.getElementById('btnAddProduct').classList.toggle('d-none', !warehouse);
      loadOptions();
      loadDataBarang();
      if (warehouse) loadSuppliers();
      if (cashier) {
        loadMembers();
      }
      loadBusinessSettings();
      document.getElementById('btnShowDashboard').classList.toggle('d-none', !manager);
      if (manager) { showView('dashboardView'); loadDashboard(); }
      else showView('stockView');
    }

    async function loginUser(event) {
      event.preventDefault();
      const button = document.getElementById('loginButton');
      button.disabled = true;
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ KdUser: document.getElementById('loginCode').value.trim(), password: document.getElementById('loginPassword').value })
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.message || 'Login gagal.');
        document.getElementById('loginPassword').value = '';
        enterAuthenticatedApp(result.user);
      } catch (err) {
        showAuthenticationError(err.message);
      } finally {
        button.disabled = false;
      }
    }

    async function setupFirstAdmin(event) {
      event.preventDefault();
      const button = document.getElementById('setupButton');
      button.disabled = true;
      try {
        const response = await fetch('/api/auth/setup', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            setupToken: document.getElementById('setupToken').value.trim(),
            KdUser: document.getElementById('setupCode').value.trim(),
            Nmuser: document.getElementById('setupName').value.trim(),
            password: document.getElementById('setupPassword').value
          })
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.message || 'Setup admin gagal.');
        document.getElementById('setupToken').value = '';
        document.getElementById('setupPassword').value = '';
        enterAuthenticatedApp(result.user);
      } catch (err) {
        showAuthenticationError(err.message);
      } finally {
        button.disabled = false;
      }
    }

    async function logoutUser() {
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
      } finally {
        currentUser = null;
        salesCart.clear();
        purchaseCart.clear();
        opnameCart.clear();
        currentPendingNo = null;
        setAuthMode(false);
        document.getElementById('loginPassword').value = '';
        await loadLoginUsers().catch(err => showAuthenticationError(err.message));
      }
    }

    function escapeHtml(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
    let managedUsers = [];
    const roleLabels = { admin: 'Admin', bos: 'Bos', kasir: 'Kasir', gudang: 'Admin Gudang' };
    const roleBadge = { admin: 'danger', bos: 'warning', kasir: 'primary', gudang: 'info' };

    async function openUserManagement() {
      if (!currentUser || !['admin', 'bos'].includes(currentUser.Role)) return;
      showView('usersView');
      await loadManagedUsers();
    }

    async function loadManagedUsers() {
      try {
        const response = await fetch('/api/users');
        const result = await response.json();
        if (!result.success) throw new Error(result.message || 'Gagal memuat user.');
        managedUsers = result.data;
        renderManagedUsers();
      } catch (err) {
        alert(err.message);
      }
    }

    function renderManagedUsers() {
      const needle = document.getElementById('userSearch').value.trim().toLowerCase();
      const role = document.getElementById('userRoleFilter').value;
      const list = managedUsers.filter(u => (!role || u.Role === role) && (!needle || `${u.KdUser} ${u.Nmuser}`.toLowerCase().includes(needle)));
      document.getElementById('userStats').innerHTML = [
        ['bi-people', 'primary', 'Total user', managedUsers.length],

    async function deleteManagedUser(user) {

      try {
        const response = await fetch(`/api/users/${encodeURIComponent(user.KdUser)}`, { method: 'DELETE' });

    async function loadReceivables() {
      const body = document.getElementById('receivableBody');
      body.replaceChildren();
      try {
        const response = await fetch('/api/piutang');
        const result = await response.json();
        if (!result.success) throw new Error(result.message);
        result.data.forEach(item => {
          const row = body.insertRow();
          [item.NmAng || item.KdAng, item.NoFak, String(item.Tgl).slice(0, 10)].forEach(value => { row.insertCell().textContent = value || '-'; });
          const total = row.insertCell(); total.className = 'text-end'; total.textContent = formatRupiah(item.Total);
          const balance = row.insertCell(); balance.className = 'text-end fw-bold'; balance.textContent = formatRupiah(item.Balance);
          const paymentCell = row.insertCell();
          const group = document.createElement('div'); group.className = 'input-group input-group-sm';
          const input = document.createElement('input'); input.type = 'number'; input.min = '0.01'; input.step = '0.01';
          input.max = item.Balance; input.className = 'form-control'; input.placeholder = 'Jumlah'; input.setAttribute('aria-label', `Pelunasan ${item.NoFak}`);
          const button = document.createElement('button'); button.type = 'button'; button.className = 'btn btn-outline-success'; button.textContent = 'Bayar';
          button.addEventListener('click', () => settleReceivable(item, input, button));
          group.append(input, button); paymentCell.appendChild(group);
        });
        if (!result.data.length) {
          const row = body.insertRow(); const cell = row.insertCell(); cell.colSpan = 6;
          cell.className = 'text-center text-muted py-4'; cell.textContent = 'Tidak ada piutang terbuka.';
        }
      } catch (err) { alert(err.message); }
    }

    async function settleReceivable(item, input, button) {
      const amount = Number(input.value);
      if (!Number.isFinite(amount) || amount <= 0) return alert('Masukkan jumlah pelunasan.');
      if (amount > Number(item.Balance)) return alert('Pembayaran melebihi saldo piutang.');
      button.disabled = true;
      try {
        const response = await fetch('/api/piutang/bayar', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ KdAng: item.KdAng, NoFak: item.NoFak, Bayar: amount })
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.message);
        alert(`${result.message} Sisa: ${formatRupiah(result.remaining)}.`);
        await loadReceivables();
        await loadMembers();
      } catch (err) { alert(err.message); button.disabled = false; }
    }

    async function loadDashboard() {
      if (!['admin', 'bos'].includes(currentUser?.Role)) return;
      try {
        const response = await fetch('/api/dashboard');
        const r = await response.json();
        if (!r.success) throw new Error(r.message);
        const now = new Date();
        const hour = now.getHours();
        document.getElementById('dashGreeting').textContent = `${hour < 11 ? 'Selamat pagi' : hour < 15 ? 'Selamat siang' : hour < 19 ? 'Selamat sore' : 'Selamat malam'}, ${currentUser.Nmuser}`;
        document.getElementById('dashDate').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        const todayTotal = Number(r.today.total), yesterdayTotal = Number(r.yesterday.total);
        const diff = yesterdayTotal > 0 ? ((todayTotal - yesterdayTotal) / yesterdayTotal * 100) : null;
        document.getElementById('dashToday').textContent = formatRupiah(todayTotal);
        document.getElementById('dashTodaySub').textContent = `${r.today.trx} transaksi` + (diff === null ? '' : ` · ${diff >= 0 ? '▲' : '▼'} ${Math.abs(diff).toFixed(1)}% vs kemarin`);
        document.getElementById('dashMonth').textContent = formatRupiah(r.month.total);
        document.getElementById('dashMonthSub').textContent = `${r.month.trx} transaksi`;
        document.getElementById('dashProfit').textContent = formatRupiah(r.month.trx > 0 ? Number(r.month.total) / r.month.trx : 0);
        document.getElementById('dashProfitSub').textContent = `${formatNumber(r.profit.qty)} item terjual`;
        document.getElementById('dashReceivable').textContent = formatRupiah(r.receivable);
        document.getElementById('dashItems').textContent = formatNumber(r.stock.items);
        document.getElementById('dashStockValue').textContent = formatRupiah(r.stock.value);
        document.getElementById('dashEmpty').textContent = formatNumber(r.stock.empty);
        document.getElementById('dashMinus').textContent = formatNumber(r.stock.minus);

        const text = chartTextColor(), grid = chartGridColor();

        const byDay = new Map(r.daily.map(row => [row.tgl, row]));
        const dailyCanvas = document.getElementById('dashDailyChart');
        const gradient = dailyCanvas.getContext('2d').createLinearGradient(0, 0, 0, 280);
        gradient.addColorStop(0, 'rgba(79,124,255,.55)');
        gradient.addColorStop(1, 'rgba(124,77,255,.02)');
        dashChart('dashDailyChart', {
          type: 'line',
          data: { labels: days.map(d => d.slice(8) + '/' + d.slice(5, 7)), datasets: [
            { label: 'Penjualan', data: days.map(d => Number(byDay.get(d)?.total || 0)), borderColor: '#4f7cff', backgroundColor: gradient, fill: true, tension: .35, pointRadius: 3, yAxisID: 'y' },
            { label: 'Transaksi', data: days.map(d => Number(byDay.get(d)?.trx || 0)), type: 'bar', backgroundColor: 'rgba(56,239,125,.55)', borderRadius: 6, yAxisID: 'y1' }
          ] },
          options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: {
            x: { ticks: { color: text }, grid: { display: false } },
            y: { beginAtZero: true, ticks: { color: text, callback: v => formatRupiah(v) }, grid: { color: grid } },
            y1: { beginAtZero: true, position: 'right', ticks: { color: text, precision: 0 }, grid: { drawOnChartArea: false } }
          }, plugins: { legend: { position: 'bottom', labels: { color: text } }, tooltip: { callbacks: { label: c => c.dataset.yAxisID === 'y' ? `Penjualan: ${formatRupiah(c.parsed.y)}` : `Transaksi: ${c.parsed.y}` } } } }
        });

        const palette = ['#4f7cff', '#38ef7d', '#ff9966', '#e052c0', '#06b6d4', '#f2b134'];
        dashChart('dashGroupChart', {
          type: 'doughnut',
          data: { labels: r.byGroup.map(g => g.nama), datasets: [{ data: r.byGroup.map(g => Number(g.total)), backgroundColor: palette, borderWidth: 0 }] },
          options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom', labels: { color: text } }, tooltip: { callbacks: { label: c => `${c.label}: ${formatRupiah(c.parsed)}` } } } }
        });

        dashChart('dashTopChart', {
          type: 'bar',
          data: { labels: r.topItems.map(i => i.nama), datasets: [{ label: 'Penjualan', data: r.topItems.map(i => Number(i.total)), backgroundColor: palette, borderRadius: 8 }] },
          options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: {
            x: { beginAtZero: true, ticks: { color: text, callback: v => formatRupiah(v) }, grid: { color: grid } },
            y: { ticks: { color: text }, grid: { display: false } }
          }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => formatRupiah(c.parsed.x) } } } }
        });

        const low = document.getElementById('dashLowStock');
        low.replaceChildren();
        r.lowStock.forEach(item => {
          const row = low.insertRow();
          row.insertCell().textContent = `${item.Nmbar} (${item.KdBar})`;
          const cell = row.insertCell();
          cell.className = 'text-end fw-bold' + (Number(item.Stok) < 0 ? ' text-negative' : '');
          cell.textContent = `${formatNumber(item.Stok)} ${item.SatKecil || ''}`;
        });
        const recent = document.getElementById('dashRecent');
        recent.replaceChildren();
        if (!r.recent.length) recent.insertRow().insertCell().textContent = 'Belum ada transaksi.';
        r.recent.forEach(item => {

    async function searchOpnameProducts(search) {
      const resultList = document.getElementById('opnameResults');
      resultList.replaceChildren();
      if (!search) return;
      try {
        const response = await fetch(`/api/cari-barang?q=${encodeURIComponent(search)}`);
        const result = await response.json();
        if (!result.success) throw new Error(result.message);
        result.data.forEach(item => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'list-group-item list-group-item-action d-flex justify-content-between';
          button.textContent = `${item.Nmbar} · ${item.KdBar} · stok ${formatNumber(item.Stok)}`;
          button.addEventListener('click', () => addToOpname(item));
          resultList.appendChild(button);
        });
      } catch (err) {
        console.error('Gagal mencari barang opname:', err);

    function addToOpname(item) {
      if (!opnameCart.has(item.KdBar)) opnameCart.set(item.KdBar, { ...item, StOpname: Number(item.Stok) || 0 });
      document.getElementById('opnameSearch').value = '';
      document.getElementById('opnameResults').replaceChildren();
      renderOpnameCart();
    }

    function renderOpnameCart() {
      const body = document.getElementById('opnameCartBody');
      body.replaceChildren();
      opnameCart.forEach(item => {
        const row = body.insertRow();
        row.insertCell().textContent = `${item.Nmbar} (${item.KdBar})`;
        const systemCell = row.insertCell();
        systemCell.className = 'text-end';
        systemCell.textContent = formatNumber(item.Stok);
        const countCell = row.insertCell();
        const input = document.createElement('input');
        input.type = 'number'; input.min = '0'; input.step = '0.001'; input.value = item.StOpname;
        input.className = 'form-control form-control-sm text-end';
        input.addEventListener('change', () => {
          const value = Number(input.value);
          if (!Number.isFinite(value) || value < 0) return;
          item.StOpname = value;
          renderOpnameCart();
        });
        countCell.appendChild(input);
        const differenceCell = row.insertCell();
        differenceCell.className = 'text-end';
        differenceCell.textContent = formatNumber(Number(item.Stok) - item.StOpname);
        const removeCell = row.insertCell();
        const remove = document.createElement('button');
        remove.type = 'button'; remove.className = 'btn btn-sm btn-outline-danger'; remove.title = 'Hapus dari daftar opname';
        remove.innerHTML = '<i class="bi bi-x-lg"></i>';
        remove.addEventListener('click', () => { opnameCart.delete(item.KdBar); renderOpnameCart(); });
        removeCell.appendChild(remove);
      });
      document.getElementById('btnSaveOpname').disabled = !opnameCart.size;
    }

    async function saveOpname() {
      if (!opnameCart.size) return;
      const button = document.getElementById('btnSaveOpname');

      try {
        const response = await fetch('/api/opname', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ Tgl: document.getElementById('opnameDate').value, items: [...opnameCart.values()].map(item => ({ KdBar: item.KdBar, StOpname: item.StOpname })) })
        });
        const result = await response.json();
        if (!result.success) throw new Error(result.message || 'Gagal menyimpan opname.');
        alert(`${result.message} Barang dengan selisih: ${result.adjusted}.`);
        opnameCart.clear();
        renderOpnameCart();
        loadDataBarang();

        alert(err.message);
        button.disabled = !opnameCart.size;
      }
    }

    async function loadMasterData() {
      if (!currentUser || !['admin', 'bos'].includes(currentUser.Role)) return;
      try {
        const responses = await Promise.all([fetch('/api/kelompok'), fetch('/api/anggota'), fetch('/api/supplier')]);
        const [groups, members, suppliers] = await Promise.all(responses.map(response => response.json()));
        if (!groups.success || !members.success || !suppliers.success) throw new Error('Gagal memuat master data.');
        renderMasterRows('groupTableBody', groups.data, item => [item.KDKEL, item.NMKEL], [
          { label: 'Ubah', run: editGroup }, { label: 'Hapus', run: deleteGroup, className: 'btn-outline-danger' }
        ]);
        renderMasterRows('memberTableBody', members.data, item => [item.KdAng, item.NmAng, item.Telp || '-', `${item.Disc || 0}%`, item.MASAAKTIF === 'N' ? 'Nonaktif' : 'Aktif'], [
          { label: 'Ubah', run: editMember },
          { label: item => item.MASAAKTIF === 'N' ? 'Aktifkan' : 'Nonaktifkan', run: toggleMember, className: 'btn-outline-secondary' }
        ]);
        renderMasterRows('masterSupplierTableBody', suppliers.data, item => [item.KdSupp, item.NmSupp, item.Telp || '-'], [
          { label: 'Ubah', run: editMasterSupplier }, { label: 'Hapus', run: deleteMasterSupplier, className: 'btn-outline-danger' }
        ]);
      } catch (err) { alert(err.message); }
    }

    function renderMasterRows(bodyId, data, valuesForRow, actions) {
      const body = document.getElementById(bodyId);
      body.replaceChildren();
      data.forEach(item => {
        const row = body.insertRow();
        valuesForRow(item).forEach(value => { row.insertCell().textContent = value ?? '-'; });
        const cell = row.insertCell();
        const actionWrap = document.createElement('div');
        actionWrap.className = 'd-flex flex-wrap justify-content-end gap-1';
        actions.forEach(action => {

    function renderPurchaseCart() {
      const body = document.getElementById('purchaseCartBody');
      body.replaceChildren();
      purchaseCart.forEach(item => {
        const row = body.insertRow();
        row.insertCell().textContent = `${item.Nmbar} (${item.KdBar})`;
        [['Qty', '0.001', '0.001'], ['PurchasePrice', '0', '0.01'], ['Disc', '0', '0.01']].forEach(([field, min, step]) => {
          const cell = row.insertCell();
          const input = document.createElement('input');
          input.type = 'number'; input.min = min; input.step = step; input.value = item[field];
          input.className = 'form-control form-control-sm';
          input.addEventListener('change', () => {
            const value = Number(input.value);
            if (!Number.isFinite(value) || value < Number(min)) return;
            item[field] = value;
            renderPurchaseCart();
          });
          cell.appendChild(input);
        });
        const amount = row.insertCell();
        amount.className = 'text-end';
        amount.textContent = formatRupiah(item.Qty * item.PurchasePrice * (1 - item.Disc / 100));
        const removeCell = row.insertCell();
        const remove = document.createElement('button');
        remove.type = 'button'; remove.className = 'btn btn-sm btn-outline-danger'; remove.title = 'Hapus barang';
        remove.innerHTML = '<i class="bi bi-x-lg"></i>';
        remove.addEventListener('click', () => { purchaseCart.delete(item.KdBar); renderPurchaseCart(); });
        removeCell.appendChild(remove);
      });
      updatePurchaseTotal();
    }

    function calculatePurchaseTotal() {
      const subtotal = [...purchaseCart.values()].reduce((total, item) => total + item.Qty * item.PurchasePrice * (1 - item.Disc / 100), 0);
      const taxRate = Math.max(0, Number(document.getElementById('purchaseTax').value) || 0);
      const extraCost = Math.max(0, Number(document.getElementById('purchaseExtra').value) || 0);
      const taxAmount = Math.round(subtotal * taxRate) / 100;
      return { subtotal, taxRate, extraCost, total: Math.round((subtotal + taxAmount + extraCost) * 100) / 100 };
    }

    function updatePurchaseTotal() {
      document.getElementById('purchaseTotal').textContent = formatRupiah(calculatePurchaseTotal().total);
    }

          body: JSON.stringify({

    async function loadCashierReport() {
      const from = document.getElementById('cashierReportFrom').value;
      const to = document.getElementById('cashierReportTo').value;
      if (!from || !to) return setSalesRange('today');
      const manager = isManagerUser();
      const cashierSelect = document.getElementById('srCashier');
      document.getElementById('srCashierWrap').classList.toggle('d-none', !manager);
      document.getElementById('srCashierChartWrap').classList.toggle('d-none', !manager);
      try {
        const params = new URLSearchParams({ from, to, kasir: manager ? cashierSelect.value : '' });
        const [response, settleResponse] = await Promise.all([
          fetch('/api/laporan-kasir?' + params),
          fetch(manager ? '/api/setoran?' + params : '/api/setoran/saya?' + params)
        ]);
        const r = await response.json();
        const settle = await settleResponse.json();
        if (!r.success) throw new Error(r.message || 'Gagal memuat laporan.');
        if (!settle.success) throw new Error(settle.message || 'Gagal memuat setoran.');
        lastCashierReport = r;
        if (manager && cashierSelect.options.length === 1) r.users.forEach(u => cashierSelect.add(new Option(u.Nmuser || u.KdUser, u.KdUser)));

        const total = Number(r.summary.total) || 0, trx = Number(r.summary.transactions) || 0;
        const rows = settle.data;
        const system = rows.reduce((a, x) => a + x.Sistem, 0);
        const recorded = rows.filter(x => x.Tercatat);
        const real = recorded.reduce((a, x) => a + x.Uang, 0), diff = recorded.reduce((a, x) => a + x.Selisih, 0);
        document.getElementById('srCards').innerHTML =
          reportCard('bi-cart-check', 'primary', 'Penjualan', formatRupiah(total), `${formatNumber(trx)} transaksi`) +
          reportCard('bi-calculator', 'info', 'Rata-rata / Transaksi', formatRupiah(trx ? total / trx : 0), `Diskon ${formatRupiah(r.summary.discount)}`) +
          reportCard('bi-x-octagon', 'secondary', 'Transaksi Batal', formatNumber(r.canceled.transactions), formatRupiah(r.canceled.total)) +
          reportCard('bi-cash', 'warning', 'Uang Sistem', formatRupiah(system), 'Kas seharusnya') +
          reportCard('bi-wallet2', 'success', 'Uang Real Dilapor', formatRupiah(real), `${recorded.length} dari ${rows.length} hari`) +
          reportCard(diff < 0 ? 'bi-arrow-down-circle' : 'bi-arrow-up-circle', diff < 0 ? 'danger' : 'success', 'Selisih Periode', (diff > 0 ? '+' : '') + formatRupiah(diff), `${rows.length - recorded.length} belum dilapor`);

    function renderSettlements(settle, manager) {
      document.getElementById('srCashHint').textContent = manager
        ? 'Isi uang real yang diterima dari tiap kasir. Selisih = uang real - uang sistem; minus (merah) berarti kurang, plus (hijau) berarti lebih.'
        : 'Hitung uang di laci lalu isi Uang Real pada baris tanggalnya. Kamu hanya bisa melapor untuk hari ini atau kemarin; selisih tercatat dan terakumulasi.';
      const totals = manager ? settle.totals : (settle.total.Hari ? [{ Nmuser: 'Saya', ...settle.total }] : []);
      document.getElementById('cashTotalsBody').innerHTML = totals.length ? totals.map(t =>
        `<tr><td class="fw-semibold">${escapeHtml(t.Nmuser)}</td><td class="text-end">${formatNumber(t.Hari)}</td><td class="text-end">${signedRupiah(t.Minus)}</td><td class="text-end">${signedRupiah(t.Plus)}</td><td class="text-end">${signedRupiah(t.Total)}</td></tr>`).join('')

          <td class="text-nowrap"><button type="button" class="btn btn-sm btn-primary" title="Simpan"><i class="bi bi-check-lg"></i></button> <button type="button" class="btn btn-sm btn-outline-danger d-none" title="Hapus catatan"><i class="bi bi-x-lg"></i></button></td>`;
        const c = tr.cells;
        c[0].textContent = item.Tgl; c[1].textContent = item.Nmuser || item.KdUser; c[2].textContent = formatNumber(item.Trx);
        c[3].textContent = formatRupiah(item.Penjualan); c[4].textContent = formatRupiah(item.Sistem);
        const real = c[5].firstChild, note = c[7].firstChild, save = c[8].children[0], clear = c[8].children[1];
        if (item.Tercatat) { real.value = item.Uang; note.value = item.Ket || ''; c[6].innerHTML = signedRupiah(item.Selisih); if (manager) clear.classList.remove('d-none'); }
        else c[6].innerHTML = '<span class="text-body-secondary">-</span>';

        save.addEventListener('click', async () => {

          try {
            const res = await fetch(manager ? '/api/setoran' : '/api/setoran/saya', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ Tgl: item.Tgl, KdUser: item.KdUser, Uang: Number(real.value), Ket: note.value }) });
            const out = await res.json();
            if (!out.success) throw new Error(out.message);
            loadCashierReport();
          } catch (err) { alert(err.message); }
        });
        clear.addEventListener('click', async () => {
          if (!confirm('Hapus catatan setoran ini?')) return;
          await fetch('/api/setoran?' + new URLSearchParams({ Tgl: item.Tgl, KdUser: item.KdUser }), { method: 'DELETE' });
          loadCashierReport();
        });

    function downloadCashierReportPdf() {

      const doc = new jsPDF();
      const r = lastCashierReport;

      doc.text(businessSettings.NmUsaha || 'ABID KARYA SAYUR', 14, 16);
      doc.setFontSize(11);
      doc.text('Laporan Penjualan', 14, 23);
      doc.setFontSize(9);
      doc.text(`Periode: ${r.from} s/d ${r.to}`, 14, 29);
      doc.text(`Total: ${formatRupiah(total)} (${transactions} transaksi) | Rata-rata: ${formatRupiah(transactions ? total / transactions : 0)}`, 14, 34);

        styles: { fontSize: 8 }, columnStyles: { 5: { halign: 'right' } }, headStyles: { fillColor: [79, 124, 255] }
      });

      try {
        const response = await fetch('/api/penjualan/batal', {
