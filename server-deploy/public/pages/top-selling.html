<div class="container-fluid px-4 d-none" id="topSellingView">
  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-md-4"><label for="topSellingFrom" class="form-label small">Dari tanggal</label><input id="topSellingFrom" type="date" class="form-control"></div>
        <div class="col-md-4"><label for="topSellingTo" class="form-label small">Sampai tanggal</label><input id="topSellingTo" type="date" class="form-control"></div>
        <div class="col-md-4"><label for="topSellingGroup" class="form-label small">Kelompok barang</label><select id="topSellingGroup" class="form-select"><option value="">Semua kelompok</option></select></div>
        <div class="col-md-4 d-flex gap-2">
          <button class="btn btn-primary flex-grow-1" onclick="loadTopSellingReport()"><i class="bi bi-search me-1"></i> Tampilkan</button>
          <button class="btn btn-outline-light" onclick="downloadTopSellingReportPdf()" title="Unduh PDF" aria-label="Unduh laporan PDF"><i class="bi bi-file-earmark-pdf"></i></button>
        </div>
      </div>
    </div>
  </div>
  <div class="card shadow-sm">
    <div class="card-header fw-bold">Barang Terlaris per Kelompok</div>
    <div class="table-responsive">
      <table class="table table-sm table-striped mb-0">
        <thead class="table-light"><tr><th>Kelompok</th><th>Kode Barang</th><th>Nama Barang</th><th class="text-end">Terjual</th><th>Satuan</th><th class="text-end">Nilai Penjualan</th></tr></thead>
        <tbody id="topSellingBody"><tr><td colspan="6" class="text-center text-muted py-3">Pilih periode lalu tekan Tampilkan.</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
