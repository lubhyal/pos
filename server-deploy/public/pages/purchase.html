<div class="container-fluid px-4 d-none" id="purchaseView">
    <div class="row g-3">
      <div class="col-lg-8">
        <div class="card shadow-sm mb-3"><div class="card-body">
          <label for="purchaseSearch" class="form-label fw-semibold">Cari barang yang diterima</label>
          <input id="purchaseSearch" class="form-control" autocomplete="off" placeholder="Barcode, kode, atau nama barang">
          <div id="purchaseResults" class="list-group mt-2"></div>
          <div class="form-text">Harga beli dan harga jual dapat diubah langsung di tabel; keduanya otomatis tersimpan ke data barang saat pembelian disimpan.</div>
        </div></div>
        <div class="card shadow-sm"><div class="table-responsive">
          <table class="table table-sm align-middle mb-0"><thead class="table-light"><tr><th>Barang</th><th>Qty</th><th>Harga Beli</th><th>Harga Jual</th><th>Diskon %</th><th class="text-end">Jumlah</th><th></th></tr></thead><tbody id="purchaseCartBody"></tbody></table>
        </div></div>
      </div>
      <div class="col-lg-4"><div class="card shadow-sm"><div class="card-header fw-bold">Penerimaan Pembelian</div><div class="card-body">
        <label class="form-label small" for="purchaseDate">Tanggal</label><input id="purchaseDate" type="date" class="form-control form-control-sm mb-2">
        <label class="form-label small" for="purchaseSupplier">Supplier</label>
        <div class="input-group input-group-sm mb-2"><select id="purchaseSupplier" class="form-select"><option value="">Pilih supplier (opsional)</option></select><button class="btn btn-outline-secondary" type="button" onclick="openSupplierModal()" title="Tambah supplier"><i class="bi bi-plus-lg"></i></button></div>
        <label class="form-label small" for="purchaseDescription">Keterangan</label><input id="purchaseDescription" class="form-control form-control-sm mb-2" maxlength="40">
        <div class="row g-2 mb-2"><div class="col-6"><label class="form-label small" for="purchaseTax">PPN (%)</label><input id="purchaseTax" type="number" min="0" max="100" step="0.01" value="0" class="form-control form-control-sm"></div><div class="col-6"><label class="form-label small" for="purchaseExtra">Biaya lain</label><input id="purchaseExtra" type="number" min="0" step="0.01" value="0" class="form-control form-control-sm"></div></div>
        <div class="d-flex justify-content-between mb-2"><span>Total</span><strong id="purchaseTotal">Rp0</strong></div>
        <label class="form-label small" for="purchasePaid">Dibayar tunai</label><input id="purchasePaid" type="number" min="0" step="0.01" value="0" class="form-control form-control-sm mb-3">
        <button class="btn btn-primary w-100" id="btnSavePurchase" onclick="savePurchase()"><i class="bi bi-save me-1"></i> Simpan Pembelian</button>
      </div></div></div>
    </div>
  </div>
