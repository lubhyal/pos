<div class="container-fluid px-4 d-none" id="settingsView">
    <div class="row justify-content-center"><div class="col-xl-8"><div class="card"><div class="card-header fw-bold">Profil Usaha dan Struk</div><div class="card-body"><form id="settingsForm"><div class="row g-3">
      <div class="col-md-6"><label class="form-label small" for="settingBusinessName">Nama usaha</label><input id="settingBusinessName" class="form-control" maxlength="50"></div>
      <div class="col-md-6"><label class="form-label small" for="settingPhone">Telepon</label><input id="settingPhone" class="form-control" maxlength="20"></div>
      <div class="col-12"><label class="form-label small" for="settingAddress">Alamat</label><input id="settingAddress" class="form-control" maxlength="50"></div>
      <div class="col-md-4"><label class="form-label small" for="settingCountry">Negara</label><input id="settingCountry" class="form-control" maxlength="50"></div>
      <div class="col-md-4"><label class="form-label small" for="settingCity">Kota</label><input id="settingCity" class="form-control" maxlength="50"></div>
      <div class="col-md-4"><label class="form-label small" for="settingProvince">Provinsi</label><input id="settingProvince" class="form-control" maxlength="50"></div>
      <div class="col-md-4"><label class="form-label small" for="settingPostal">Kode pos</label><input id="settingPostal" class="form-control" maxlength="20"></div>
      <div class="col-md-4"><label class="form-label small" for="settingFax">Fax</label><input id="settingFax" class="form-control" maxlength="20"></div>
      <div class="col-md-4"><label class="form-label small" for="settingNpwp">NPWP</label><input id="settingNpwp" class="form-control" maxlength="20"></div>
      <div class="col-md-6"><label class="form-label small" for="settingEmail">Email</label><input id="settingEmail" type="email" class="form-control" maxlength="50"></div>
      <div class="col-md-6"><label class="form-label small" for="settingWebsite">Website</label><input id="settingWebsite" class="form-control" maxlength="50"></div>
      <div class="col-md-4"><label class="form-label small" for="settingTax">PPN pembelian (%)</label><input id="settingTax" type="number" min="0" max="100" step="0.01" class="form-control"></div>
      <div class="col-md-4"><label class="form-label small" for="settingDiscount">Diskon default (%)</label><input id="settingDiscount" type="number" min="0" max="100" step="0.01" class="form-control"></div>
      <div class="col-md-4"><label class="form-label small" for="settingQty">Baris item struk</label><input id="settingQty" type="number" min="0" max="99999" step="1" class="form-control"></div>
      <div class="col-md-6"><label class="form-label small" for="settingReceiptHeader">Header struk</label><input id="settingReceiptHeader" class="form-control" maxlength="50"></div>
      <div class="col-md-6"><label class="form-label small" for="settingReceiptFooter">Footer struk</label><input id="settingReceiptFooter" class="form-control" maxlength="50"></div>
      <div class="col-md-6"><label class="form-label small" for="settingReceiptFooter2">Footer baris 2</label><input id="settingReceiptFooter2" class="form-control" maxlength="50"></div>
      <div class="col-md-6"><label class="form-label small" for="settingReceiptFooter3">Footer baris 3</label><input id="settingReceiptFooter3" class="form-control" maxlength="50"></div>
      <div class="col-12 d-flex flex-wrap gap-3"><div class="form-check"><input id="settingPrintSale" class="form-check-input" type="checkbox"><label for="settingPrintSale" class="form-check-label">Cetak struk penjualan</label></div><div class="form-check"><input id="settingPrintBarcode" class="form-check-input" type="checkbox"><label for="settingPrintBarcode" class="form-check-label">Tampilkan barcode</label></div></div>
      <div class="col-12"><button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i> Simpan Pengaturan</button></div>
    </div></form></div></div></div></div>
  </div>
