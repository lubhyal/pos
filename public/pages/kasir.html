<div class="container-fluid px-4 d-none" id="kasirView">
    <div class="row g-3">
      <div class="col-lg-8">
        <div class="card shadow-sm mb-3"><div class="card-body py-2 d-flex flex-wrap align-items-center gap-2">
          <i class="bi bi-cash-stack text-success"></i><span class="small text-body-secondary">Kas awal hari ini</span><strong id="kasAwalValue">-</strong>
          <button type="button" tabindex="-1" class="btn btn-sm btn-outline-secondary ms-auto" onclick="ensureKasAwal(true)">Ubah <span class="text-body-secondary">(F9)</span></button>
        </div></div>
        <div class="card shadow-sm mb-3">
          <div class="card-body">
            <label for="searchProduct" class="form-label fw-semibold fs-5">Cari atau scan barang</label>
            <input id="searchProduct" class="form-control form-control-lg fs-4" autocomplete="off" placeholder="Scan barcode / ketik kode atau nama..." autofocus>
            <div id="productResults" class="list-group mt-2 fs-5"></div>
            <div class="d-flex flex-wrap gap-2 mt-3">
              <button class="btn btn-outline-primary" onclick="savePendingSale()"><i class="bi bi-pause-circle me-1"></i> Tunda Transaksi</button>
              <button class="btn btn-outline-secondary" onclick="loadPendingSales()"><i class="bi bi-folder2-open me-1"></i> Panggil Tertunda</button>
            </div>
            <div id="pendingSalesList" class="list-group mt-2"></div>
          </div>
        </div>
        <div class="card shadow-sm">
          <div class="table-responsive">
            <table class="table table-sm align-middle mb-0 fs-5">
              <thead class="table-light"><tr><th>Barang</th><th class="text-center">Harga</th><th class="text-center">Qty</th><th class="text-end">Jumlah</th><th></th></tr></thead>
              <tbody id="cartBody"><tr><td colspan="5" class="text-center text-muted py-4">Keranjang masih kosong.</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-header fw-bold fs-5">Pembayaran</div>
          <div class="card-body">
            <label for="saleCustomer" class="form-label small">Anggota (opsional)</label>
            <select id="saleCustomer" class="form-select mb-2"><option value="">Pelanggan umum</option></select>
            <div class="d-flex justify-content-between align-items-center mb-2 fs-5"><span>Subtotal</span><strong id="saleSubtotal">Rp0</strong></div>
            <label class="form-label small" for="saleDiscount">Diskon (%)</label>
            <input id="saleDiscount" type="number" class="form-control mb-2" min="0" max="100" step="0.01" value="0">
            <div class="d-flex justify-content-between align-items-center mb-3"><span class="fs-5">Total</span><strong class="fs-2 text-success" id="saleGrandTotal">Rp0</strong></div>

            <label class="form-label small">Metode pembayaran</label>
            <input type="hidden" id="paymentMethod" value="cash">
            <div class="row g-2 mb-3" id="paymentMethodGroup">
              <div class="col-6"><button type="button" tabindex="-1" class="btn btn-outline-secondary w-100 py-2 active" data-method="cash" onclick="setPaymentMethod('cash')"><i class="bi bi-cash-coin me-1"></i>Tunai<div class="small opacity-75">Alt+1</div></button></div>
              <div class="col-6"><button type="button" tabindex="-1" class="btn btn-outline-secondary w-100 py-2" data-method="qris" onclick="setPaymentMethod('qris')"><i class="bi bi-qr-code me-1"></i>QRIS<div class="small opacity-75">Alt+2</div></button></div>
              <div class="col-6"><button type="button" tabindex="-1" class="btn btn-outline-secondary w-100 py-2" data-method="transfer" onclick="setPaymentMethod('transfer')"><i class="bi bi-bank me-1"></i>Transfer<div class="small opacity-75">Alt+3</div></button></div>
              <div class="col-6"><button type="button" tabindex="-1" class="btn btn-outline-secondary w-100 py-2" data-method="edc" onclick="setPaymentMethod('edc')"><i class="bi bi-credit-card-2-front me-1"></i>EDC<div class="small opacity-75">Alt+4</div></button></div>
            </div>

            <div id="cashBlock">
              <label for="cashReceived" id="cashReceivedLabel" class="form-label small">Uang diterima <span class="text-body-secondary">(Enter = uang pas)</span></label>
              <input id="cashReceived" type="number" class="form-control form-control-lg fs-3 mb-3" min="0" step="1" value="0" autocomplete="off">
              <div class="d-flex justify-content-between align-items-center mb-3 fs-4"><span id="saleChangeLabel">Kembalian</span><strong id="saleChange">Rp0</strong></div>
            </div>
            <div id="saleDone" class="alert alert-success d-none text-center py-2 mb-3" role="status"></div>
            <button class="btn btn-success btn-lg w-100 fs-4" id="btnCompleteSale" tabindex="-1" onclick="completeSale()"><i class="bi bi-check2-circle me-1"></i> Selesaikan Transaksi</button>
            <button class="btn btn-link btn-sm w-100 mt-2 text-danger" tabindex="-1" onclick="clearCart()">Kosongkan keranjang <span class="text-body-secondary">(Ctrl+Del)</span></button>
          </div>
        </div>
      </div>
    </div>
    <div class="card shadow-sm mt-3"><div class="card-body py-2 small text-body-secondary d-flex flex-wrap gap-x-3 gap-3" id="kasirHints">
      <span><kbd>Scan</kbd>/ketik + <kbd>Enter</kbd> tambah barang</span>
      <span><kbd>↑</kbd><kbd>↓</kbd> pilih baris / hasil</span>
      <span><kbd>+</kbd><kbd>-</kbd> ubah qty</span>
      <span><kbd>Del</kbd> hapus baris</span>
      <span><kbd>Enter</kbd> (kolom kosong) bayar</span>
      <span><kbd>Alt+1-4</kbd> metode</span>
      <span><kbd>F2</kbd> tunda</span>
      <span><kbd>F4</kbd> panggil tertunda</span>
      <span><kbd>Esc</kbd> kembali ke scan</span>
    </div></div>
  </div>
